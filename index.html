<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01050b">

<title>JOHANN · KI MIT HERZ</title>

<style>
:root{
  --vfl:#005CA9;
  --vfl-bright:#0088e8;
  --vfl-light:#35b8ff;
  --white:#eef7ff;
  --muted:#9baabd;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01050b;
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}

/* =====================================================
   ECHTER JOHANN-RAUM
===================================================== */

.scene{
  position:fixed;
  inset:0;
  overflow:hidden;

  background-image:
    linear-gradient(
      rgba(0,8,18,.08),
      rgba(0,5,12,.15)
    ),
    url("0BF4A026-7B00-4323-8619-BC514996DE1E.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* Querformat automatisch anderes Bild */

@media (orientation:landscape){

  .scene{
    background-image:
      linear-gradient(
        rgba(0,8,18,.06),
        rgba(0,5,12,.13)
      ),
      url("AEB4EA74-98B5-4124-B294-B39011A5E935.png");
  }
}

/* leichte Abdunklung nur für Lesbarkeit */

.scene::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;

  background:
    radial-gradient(
      ellipse at center,
      transparent 25%,
      rgba(0,4,10,.05) 60%,
      rgba(0,3,8,.18) 100%
    );
}


/* =====================================================
   UHR
===================================================== */

.clock{
  position:absolute;
  z-index:20;

  top:max(4.3vh,env(safe-area-inset-top));
  left:5.5vw;
}

.time{
  font-size:clamp(36px,7vw,70px);
  font-weight:200;
  line-height:1;
  letter-spacing:-.02em;

  text-shadow:0 2px 15px rgba(0,0,0,.4);
}

.date{
  margin-top:10px;

  font-size:clamp(10px,1.8vw,17px);
  font-weight:300;

  color:#c1cad4;

  text-shadow:0 2px 10px #000;
}


/* =====================================================
   JOHANN LOGO
===================================================== */

.brand{
  position:absolute;
  z-index:20;

  top:max(4.8vh,env(safe-area-inset-top));
  left:50%;

  transform:translateX(-50%);

  text-align:center;
  white-space:nowrap;
}

.logo{
  font-size:clamp(24px,4.6vw,46px);

  font-weight:250;

  letter-spacing:.30em;
  margin-left:.30em;

  text-shadow:
    0 2px 18px rgba(0,0,0,.55);
}

.logo .a{
  color:var(--vfl-bright);

  text-shadow:
    0 0 8px rgba(0,92,169,.9),
    0 0 20px rgba(0,92,169,.55);
}

.tag{
  margin-top:9px;
  margin-left:.45em;

  color:#57b4ef;

  font-size:clamp(7px,1vw,11px);

  letter-spacing:.48em;
}


/* =====================================================
   LIVE WETTER
===================================================== */

.weather{
  position:absolute;
  z-index:20;

  top:max(4.8vh,env(safe-area-inset-top));
  right:5vw;

  display:flex;
  gap:9px;
  align-items:flex-start;

  text-shadow:0 2px 12px #000;
}

.weather-icon{
  width:43px;

  font-size:29px;
  line-height:1;

  text-align:center;

  color:#d9edff;
}

.temperature{
  font-size:clamp(27px,4.5vw,45px);
  font-weight:250;
  line-height:.9;
}

.weather-info{
  margin-top:7px;

  font-size:12px;
  line-height:1.35;

  color:#d2dae3;
}


/* =====================================================
   JOHANN KUGEL

   bewusst:
   - kleiner
   - kompakter
   - fülliger
   - weniger Außenlinien
   - VfL-Blau
===================================================== */

.johann{
  position:absolute;
  z-index:10;

  left:50%;
  top:48%;

  width:min(57vw,510px);

  aspect-ratio:1;

  transform:translate(-50%,-50%);

  touch-action:none;
}

#energy{
  width:100%;
  height:100%;
  display:block;

  filter:
    drop-shadow(0 0 8px rgba(0,92,169,.45))
    drop-shadow(0 0 24px rgba(0,92,169,.20));
}


/* Bodenreflexion */

.orb-reflection{
  position:absolute;
  z-index:8;

  left:50%;
  top:65%;

  transform:translateX(-50%);

  width:min(32vw,300px);
  height:7vh;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,92,169,.34) 0%,
      rgba(0,92,169,.14) 32%,
      rgba(0,92,169,.04) 55%,
      transparent 72%
    );

  filter:blur(12px);

  animation:reflectionPulse 4s ease-in-out infinite;
}

.orb-floor-point{
  position:absolute;
  z-index:9;

  left:50%;
  top:64.5%;

  width:4px;
  height:4px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#aee9ff;

  box-shadow:
    0 0 8px #dff8ff,
    0 0 18px #0088e8,
    0 0 35px #005CA9;
}

@keyframes reflectionPulse{

  0%,100%{
    opacity:.55;
    transform:translateX(-50%) scaleX(.88);
  }

  50%{
    opacity:.85;
    transform:translateX(-50%) scaleX(1.05);
  }
}


/* =====================================================
   UNTEN
===================================================== */

.slogan{
  position:absolute;
  z-index:20;

  left:0;
  right:0;

  bottom:13vh;

  text-align:center;

  font-size:clamp(7px,1.1vw,11px);

  letter-spacing:.35em;

  color:#d1dae3;

  text-shadow:0 2px 10px #000;
}

.slogan span{
  color:#2ea8f4;
}

.controls{
  position:absolute;
  z-index:30;

  left:4vw;
  right:4vw;

  bottom:max(3.7vh,env(safe-area-inset-bottom));

  display:flex;
  align-items:center;

  gap:14px;
}

.round{
  width:52px;
  height:52px;

  flex:0 0 52px;

  border-radius:50%;

  border:1px solid rgba(0,136,232,.75);

  background:rgba(0,7,17,.68);

  color:#20a9ff;

  display:grid;
  place-items:center;

  font-size:21px;

  backdrop-filter:blur(13px);

  box-shadow:
    inset 0 0 18px rgba(0,92,169,.12),
    0 0 15px rgba(0,92,169,.08);
}

.command{
  flex:1;

  height:52px;

  border-radius:28px;

  border:1px solid rgba(0,136,232,.55);

  background:rgba(0,7,17,.62);

  color:#a5b2c1;

  display:flex;
  align-items:center;

  padding:0 21px;

  font-size:13px;
  font-weight:300;

  backdrop-filter:blur(14px);

  box-shadow:
    inset 0 0 25px rgba(0,92,169,.07);
}

.dots{
  letter-spacing:4px;
  padding-left:4px;
}


/* =====================================================
   HANDY
===================================================== */

@media(max-width:700px){

  .clock{
    left:5vw;
  }

  .time{
    font-size:34px;
  }

  .date{
    font-size:10px;
  }

  .brand{
    top:max(5vh,env(safe-area-inset-top));
  }

  .logo{
    font-size:22px;
  }

  .tag{
    font-size:6px;
  }

  .weather{
    right:5vw;
  }

  .weather-icon{
    width:30px;
    font-size:24px;
  }

  .temperature{
    font-size:25px;
  }

  .weather-info{
    font-size:9px;
  }

  /* deutlich kleiner als vorher */

  .johann{
    width:min(69vw,390px);
    top:47%;
  }

  .orb-reflection{
    width:42vw;
    top:61.8%;
  }

  .orb-floor-point{
    top:61.5%;
  }

  .slogan{
    bottom:12vh;
    font-size:6px;
  }

  .controls{
    left:14px;
    right:14px;

    gap:11px;
  }

  .round{
    width:46px;
    height:46px;

    flex-basis:46px;
  }

  .command{
    height:46px;

    padding:0 16px;

    font-size:11px;
  }
}


/* =====================================================
   QUERFORMAT
===================================================== */

@media(orientation:landscape){

  .johann{
    width:min(38vw,480px);
    top:49%;
  }

  .orb-reflection{
    width:26vw;
    top:69%;
  }

  .orb-floor-point{
    top:68.5%;
  }

  .slogan{
    bottom:13vh;
  }
}

</style>
</head>


<body>

<main class="scene">

  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </section>


  <header class="brand">

    <div class="logo">
      JOH<span class="a">A</span>NN
    </div>

    <div class="tag">
      KI MIT HERZ
    </div>

  </header>


  <section class="weather">

    <div
      class="weather-icon"
      id="weatherIcon">
      ◌
    </div>

    <div>

      <div
        class="temperature"
        id="temperature">
        --°
      </div>

      <div class="weather-info">

        Bochum<br>

        <span id="weatherText">
          Wetter laden…
        </span>

      </div>

    </div>

  </section>


  <!-- JOHANN -->

  <div
    class="johann"
    id="touchArea">

    <canvas id="energy"></canvas>

  </div>


  <div class="orb-reflection"></div>
  <div class="orb-floor-point"></div>


  <div class="slogan">
    <span>ZUHAUSE.</span>
    INTELLIGENTER.
    GEMEINSAM.
  </div>


  <section class="controls">

    <button
      class="round"
      aria-label="Johann aktivieren">
      ◉
    </button>

    <div
      class="command"
      id="message">

      Sag einfach, was du brauchst ...

    </div>

    <button
      class="round dots"
      aria-label="Mehr">
      •••
    </button>

  </section>

</main>


<script>

/* =====================================================
   UHR
===================================================== */

function updateClock(){

  const now=new Date();

  document.getElementById("time").textContent=
    now.toLocaleTimeString(
      "de-DE",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  document.getElementById("date").textContent=
    now.toLocaleDateString(
      "de-DE",
      {
        weekday:"short",
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );
}

updateClock();

setInterval(
  updateClock,
  1000
);


/* =====================================================
   LIVE WETTER BOCHUM
===================================================== */

function weatherDescription(code){

  if(code===0)
    return ["Klar","☀"];

  if([1,2].includes(code))
    return ["Leicht bewölkt","◒"];

  if(code===3)
    return ["Bewölkt","☁"];

  if([45,48].includes(code))
    return ["Nebel","≋"];

  if([51,53,55,56,57].includes(code))
    return ["Nieselregen","☂"];

  if(
    [61,63,65,66,67,80,81,82]
    .includes(code)
  )
    return ["Regen","☂"];

  if(
    [71,73,75,77,85,86]
    .includes(code)
  )
    return ["Schnee","❄"];

  if([95,96,99].includes(code))
    return ["Gewitter","ϟ"];

  return ["Aktuell","◌"];
}


async function loadWeather(){

  const tempElement=
    document.getElementById(
      "temperature"
    );

  const textElement=
    document.getElementById(
      "weatherText"
    );

  const iconElement=
    document.getElementById(
      "weatherIcon"
    );

  try{

    const url=
      "https://api.open-meteo.com/v1/forecast"+
      "?latitude=51.4818"+
      "&longitude=7.2162"+
      "&current=temperature_2m,weather_code"+
      "&timezone=Europe%2FBerlin";

    const response=
      await fetch(url);

    if(!response.ok)
      throw new Error(
        "Wetter nicht erreichbar"
      );

    const data=
      await response.json();

    const temperature=
      Math.round(
        data.current.temperature_2m
      );

    const weather=
      weatherDescription(
        data.current.weather_code
      );

    tempElement.textContent=
      temperature+"°";

    textElement.textContent=
      weather[0];

    iconElement.textContent=
      weather[1];

  }
  catch(error){

    tempElement.textContent="--°";

    textElement.textContent=
      "Keine Verbindung";

    iconElement.textContent="◌";
  }
}

loadWeather();

setInterval(
  loadWeather,
  600000
);


/* =====================================================
   JOHANN
===================================================== */

const canvas=
  document.getElementById(
    "energy"
  );

const ctx=
  canvas.getContext("2d");

const touchArea=
  document.getElementById(
    "touchArea"
  );

const message=
  document.getElementById(
    "message"
  );


let W=0;
let H=0;

let cx=0;
let cy=0;

let dpr=
  Math.min(
    window.devicePixelRatio||1,
    2
  );


let active=false;

let targetEnergy=0;
let energy=0;

let targetX=0;
let targetY=0;

let offsetX=0;
let offsetY=0;

let holdTimer;


/* weniger Partikel als vorher */

const particles=[];


/* nur wenige Hauptbahnen */

const streams=[];


/* =====================================================
   CANVAS GRÖSSE
===================================================== */

function resize(){

  const rect=
    canvas.getBoundingClientRect();

  W=rect.width;
  H=rect.height;

  canvas.width=
    Math.floor(W*dpr);

  canvas.height=
    Math.floor(H*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  cx=W/2;
  cy=H/2;

  createJohann();
}

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   JOHANN ERZEUGEN
===================================================== */

function createJohann(){

  particles.length=0;
  streams.length=0;


  /* Partikel hauptsächlich IN der Kugel */

  for(let i=0;i<105;i++){

    const angle=
      Math.random()*
      Math.PI*2;

    /*
      sqrt sorgt dafür,
      dass die Punkte die Fläche
      schöner ausfüllen
    */

    const radius=
      Math.sqrt(Math.random())*
      W*.275;

    particles.push({

      angle:angle,

      radius:radius,

      speed:
        (.00005+
         Math.random()*.00020)*
        (Math.random()>.5?1:-1),

      squash:
        .72+
        Math.random()*.22,

      size:
        .25+
        Math.random()*.95,

      alpha:
        .12+
        Math.random()*.55,

      phase:
        Math.random()*
        Math.PI*2
    });
  }


  /*
    Nur 7 Energiebahnen.
    Vorher waren es sehr viel mehr.
  */

  for(let i=0;i<7;i++){

    streams.push({

      radius:
        W*(
          .205+
          Math.random()*.060
        ),

      squash:
        .66+
        Math.random()*.22,

      rotation:
        Math.random()*
        Math.PI*2,

      speed:
        (.000035+
         Math.random()*.000065)*
        (Math.random()>.5?1:-1),

      start:
        Math.random()*
        Math.PI*2,

      length:
        1.0+
        Math.random()*1.5,

      width:
        .65+
        Math.random()*.70,

      alpha:
        .25+
        Math.random()*.22
    });
  }
}


/* =====================================================
   GEFÜLLTER BLAUER KÖRPER
===================================================== */

function drawBody(time){

  const x=
    cx+offsetX*.24;

  const y=
    cy+offsetY*.24;

  const breathe=
    1+
    Math.sin(time*.0016)*.018+
    energy*.025;


  /*
    Das ist jetzt der eigentliche
    "Körper" von Johann.
    Nicht mehr nur Linien.
  */

  const body=
    ctx.createRadialGradient(

      x-W*.035,
      y-W*.045,
      W*.015,

      x,
      y,
      W*.285*breathe
    );


  body.addColorStop(
    0,
    "rgba(20,125,215,.34)"
  );

  body.addColorStop(
    .28,
    "rgba(0,92,169,.26)"
  );

  body.addColorStop(
    .58,
    "rgba(0,70,145,.18)"
  );

  body.addColorStop(
    .82,
    "rgba(0,52,112,.10)"
  );

  body.addColorStop(
    1,
    "rgba(0,35,80,0)"
  );


  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    W*.285*breathe,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    zweite innere Schicht:
    macht die Kugel fülliger
  */

  const inner=
    ctx.createRadialGradient(
      x,y,0,
      x,y,W*.20
    );

  inner.addColorStop(
    0,
    "rgba(0,136,232,.16)"
  );

  inner.addColorStop(
    .55,
    "rgba(0,92,169,.12)"
  );

  inner.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );

  ctx.fillStyle=inner;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    W*.20,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =====================================================
   ÄUSSERE KUGELKANTE
===================================================== */

function drawShell(time){

  const x=
    cx+offsetX*.27;

  const y=
    cy+offsetY*.27;

  const breathe=
    1+
    Math.sin(time*.0016)*.015+
    energy*.02;

  const radius=
    W*.255*breathe;


  /* dunklere Grundkante */

  ctx.beginPath();

  ctx.arc(
    x,y,radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(0,92,169,.40)";

  ctx.lineWidth=1.2;

  ctx.shadowColor=
    "#005CA9";

  ctx.shadowBlur=
    8+energy*4;

  ctx.stroke();


  /*
    Nicht kompletter Neonring.
    Drei hellere Segmente.
  */

  for(let i=0;i<3;i++){

    const start=
      time*.00008+
      i*2.10;

    ctx.beginPath();

    ctx.arc(
      x,y,radius,
      start,
      start+.72
    );

    ctx.strokeStyle=
      `rgba(
        0,
        136,
        232,
        ${.58+energy*.08}
      )`;

    ctx.lineWidth=
      1.4+energy*.15;

    ctx.shadowColor=
      "#0088e8";

    ctx.shadowBlur=
      9+energy*4;

    ctx.stroke();
  }
}


/* =====================================================
   WENIGE ENERGIEBAHNEN
===================================================== */

function drawStream(
  stream,
  time
){

  ctx.save();

  ctx.translate(
    cx+offsetX*.34,
    cy+offsetY*.34
  );

  ctx.rotate(
    stream.rotation+
    time*stream.speed
  );

  ctx.scale(
    1,
    stream.squash
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    stream.radius,
    stream.start,
    stream.start+
    stream.length
  );

  /*
    VfL-Blau als Grundfarbe.
    Nur die hellsten Spitzen
    gehen Richtung Cyan.
  */

  ctx.strokeStyle=
    `rgba(
      0,
      125,
      220,
      ${stream.alpha+
        energy*.08}
    )`;

  ctx.lineWidth=
    stream.width*
    (1+energy*.15);

  ctx.shadowColor=
    "#005CA9";

  ctx.shadowBlur=
    6+energy*5;

  ctx.stroke();

  ctx.restore();
}


/* =====================================================
   PARTIKEL
===================================================== */

function drawParticles(time){

  for(const p of particles){

    p.angle+=
      p.speed*
      (1+energy*.55);


    const x=
      cx+
      Math.cos(p.angle)*
      p.radius+
      offsetX*.22;


    const y=
      cy+
      Math.sin(p.angle)*
      p.radius*
      p.squash+
      offsetY*.22;


    /*
      Die meisten Partikel bleiben
      dunkel VfL-blau.
      Nur einzelne funkeln heller.
    */

    const twinkle=
      Math.sin(
        time*.002+
        p.phase
      );


    const alpha=
      p.alpha*
      (
        twinkle>.88
        ?1.6
        :1
      );


    ctx.beginPath();

    ctx.fillStyle=
      `rgba(
        20,
        145,
        225,
        ${alpha}
      )`;

    ctx.shadowColor=
      "#0074c8";

    ctx.shadowBlur=
      p.size>0.8
      ?4
      :2;


    ctx.arc(
      x,
      y,
      p.size*
      (1+energy*.12),
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* =====================================================
   KLEINER KERN
===================================================== */

function drawCore(time){

  const x=
    cx+offsetX*.40;

  const y=
    cy+offsetY*.40;


  const pulse=
    1+
    Math.sin(time*.0022)*.05+
    energy*.08;


  /*
    Halo bewusst klein.
    Kein Scheinwerfer.
  */

  const halo=
    ctx.createRadialGradient(
      x,y,0,
      x,y,W*.050*pulse
    );


  halo.addColorStop(
    0,
    "rgba(110,210,255,.75)"
  );

  halo.addColorStop(
    .16,
    "rgba(0,136,232,.52)"
  );

  halo.addColorStop(
    .45,
    "rgba(0,92,169,.16)"
  );

  halo.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );


  ctx.fillStyle=halo;

  ctx.beginPath();

  ctx.arc(
    x,y,
    W*.050*pulse,
    0,
    Math.PI*2
  );

  ctx.fill();


  const coreRadius=
    Math.max(
      2.4,
      W*.0065
    );


  const core=
    ctx.createRadialGradient(
      x,y,0,
      x,y,
      coreRadius*2
    );


  core.addColorStop(
    0,
    "#dff8ff"
  );

  core.addColorStop(
    .22,
    "#5ec9ff"
  );

  core.addColorStop(
    .55,
    "#0088e8"
  );

  core.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );


  ctx.fillStyle=core;

  ctx.beginPath();

  ctx.arc(
    x,y,
    coreRadius*2,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(time){

  ctx.clearRect(
    0,0,W,H
  );


  offsetX+=
    (targetX-offsetX)*
    .055;

  offsetY+=
    (targetY-offsetY)*
    .055;

  energy+=
    (targetEnergy-energy)*
    .045;


  ctx.globalCompositeOperation=
    "lighter";


  drawBody(time);

  drawShell(time);


  for(
    const stream
    of streams
  ){

    drawStream(
      stream,
      time
    );
  }


  drawParticles(time);

  drawCore(time);


  ctx.globalCompositeOperation=
    "source-over";


  requestAnimationFrame(
    animate
  );
}


/* =====================================================
   TOUCH
===================================================== */

function pointerPosition(event){

  const rect=
    touchArea
    .getBoundingClientRect();


  const x=
    event.clientX-
    (
      rect.left+
      rect.width/2
    );


  const y=
    event.clientY-
    (
      rect.top+
      rect.height/2
    );


  /*
    Bewegung absichtlich subtil.
    Die Kugel soll nicht
    hinter dem Finger herrennen.
  */

  targetX=
    Math.max(
      -14,
      Math.min(
        14,
        x*.055
      )
    );


  targetY=
    Math.max(
      -14,
      Math.min(
        14,
        y*.055
      )
    );
}


touchArea.addEventListener(
  "pointerdown",
  event=>{

    active=true;

    touchArea
      .setPointerCapture(
        event.pointerId
      );


    pointerPosition(event);


    targetEnergy=.55;


    message.textContent=
      "Ja?";


    holdTimer=
      setTimeout(
        ()=>{

          targetEnergy=1.05;

          message.textContent=
            "Ich höre dir zu.";

        },
        550
      );
  }
);


touchArea.addEventListener(
  "pointermove",
  event=>{

    if(active){
      pointerPosition(event);
    }
  }
);


function release(){

  clearTimeout(
    holdTimer
  );

  active=false;

  targetX=0;
  targetY=0;

  targetEnergy=0;


  setTimeout(
    ()=>{

      if(!active){

        message.textContent=
          "Sag einfach, was du brauchst ...";
      }

    },
    800
  );
}


touchArea.addEventListener(
  "pointerup",
  release
);


touchArea.addEventListener(
  "pointercancel",
  release
);


/* =====================================================
   START
===================================================== */

resize();

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
