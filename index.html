<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<title>JOHANN · KI MIT HERZ</title>

<style>
:root{
  --blue:#119dff;
  --cyan:#55ddff;
  --white:#eef7ff;
  --muted:#8799ac;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01050a;
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}

.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 48%,
      rgba(0,93,180,.10) 0%,
      rgba(0,38,80,.045) 32%,
      transparent 60%),
    linear-gradient(180deg,#06101a 0%,#020811 55%,#010408 100%);
}

/* =========================
   RAUM
========================= */

.back-wall{
  position:absolute;
  inset:0 0 31% 0;
  background:
    linear-gradient(90deg,
      rgba(4,12,20,.98) 0%,
      rgba(7,18,29,.95) 22%,
      rgba(5,15,26,.96) 66%,
      rgba(7,21,34,.93) 100%);
}

.panel{
  position:absolute;
  top:0;
  bottom:0;
  width:1px;
  background:linear-gradient(
    transparent,
    rgba(67,135,188,.17) 15%,
    rgba(67,135,188,.13) 85%,
    transparent
  );
  box-shadow:0 0 14px rgba(0,91,170,.06);
}

.p1{left:14%}
.p2{left:34%}
.p3{left:67%}
.p4{left:86%}

.window{
  position:absolute;
  top:0;
  right:0;
  width:30%;
  height:69%;
  overflow:hidden;
  border-left:1px solid rgba(83,158,215,.20);
  background:
    linear-gradient(90deg,
      rgba(5,17,29,.35),
      rgba(7,28,48,.13)),
    radial-gradient(circle at 65% 50%,
      rgba(34,104,160,.24),
      transparent 56%);
}

.window::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      transparent 49.4%,
      rgba(112,174,220,.17) 50%,
      transparent 50.6%),
    linear-gradient(180deg,
      transparent 47%,
      rgba(112,174,220,.11) 47.5%,
      transparent 48%);
}

.window::after{
  content:"";
  position:absolute;
  left:10%;
  right:0;
  bottom:8%;
  height:28%;
  opacity:.55;
  filter:blur(2px);
  background:
    radial-gradient(circle at 5% 68%,#f3d58a 0 1px,transparent 2px),
    radial-gradient(circle at 18% 47%,#83cfff 0 1px,transparent 2px),
    radial-gradient(circle at 31% 73%,#ffd990 0 1px,transparent 2px),
    radial-gradient(circle at 46% 41%,#8bd2ff 0 1px,transparent 2px),
    radial-gradient(circle at 58% 68%,#ffd07d 0 1px,transparent 2px),
    radial-gradient(circle at 73% 53%,#82caff 0 1px,transparent 2px),
    radial-gradient(circle at 88% 75%,#ffd891 0 1px,transparent 2px);
}

/* angedeutete Pflanze links */

.plant{
  position:absolute;
  left:-20px;
  bottom:28%;
  width:180px;
  height:270px;
  opacity:.34;
  filter:blur(1.8px);
}

.stem{
  position:absolute;
  left:76px;
  bottom:0;
  width:4px;
  height:190px;
  background:#11261e;
  transform:rotate(-4deg);
}

.leaf{
  position:absolute;
  width:90px;
  height:31px;
  background:
    linear-gradient(90deg,#07120e,#163225);
  border-radius:100% 0 100% 0;
  transform-origin:0 50%;
}

.l1{left:75px;bottom:145px;transform:rotate(-38deg)}
.l2{left:75px;bottom:115px;transform:rotate(20deg)}
.l3{left:72px;bottom:85px;transform:rotate(-62deg)}
.l4{left:75px;bottom:60px;transform:rotate(38deg)}
.l5{left:70px;bottom:172px;transform:rotate(-78deg);width:75px}

/* Boden */

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:32%;
  border-top:1px solid rgba(72,133,181,.15);
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(0,118,235,.12),
      rgba(0,63,130,.035) 33%,
      transparent 62%),
    linear-gradient(180deg,#05101a 0%,#010408 86%);
}

.floor::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.25;
  background:
    linear-gradient(90deg,
      transparent 49.8%,
      rgba(57,113,158,.13) 50%,
      transparent 50.2%);
}

.floor-glow{
  position:absolute;
  left:50%;
  top:68%;
  width:46%;
  height:30%;
  transform:translateX(-50%);
  background:linear-gradient(
    180deg,
    rgba(0,123,255,.13),
    rgba(0,65,150,.025) 62%,
    transparent
  );
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
  filter:blur(12px);
}

/* =========================
   KOPFZEILE
========================= */

.clock{
  position:absolute;
  z-index:20;
  top:max(4.5vh,env(safe-area-inset-top));
  left:5.5vw;
}

.time{
  font-size:clamp(37px,7vw,68px);
  line-height:1;
  font-weight:200;
  letter-spacing:-.02em;
}

.date{
  margin-top:12px;
  color:#aab7c5;
  font-size:clamp(11px,1.8vw,17px);
  font-weight:300;
}

.brand{
  position:absolute;
  z-index:20;
  top:max(5vh,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
}

.logo{
  font-size:clamp(24px,4.5vw,43px);
  font-weight:250;
  letter-spacing:.30em;
  margin-left:.30em;
}

.logo .a{
  color:#159eff;
  text-shadow:
    0 0 10px rgba(0,150,255,.5),
    0 0 28px rgba(0,120,255,.25);
}

.tag{
  margin-top:10px;
  margin-left:.45em;
  color:#61b8f3;
  font-size:clamp(7px,1vw,10px);
  letter-spacing:.48em;
}

.weather{
  position:absolute;
  z-index:20;
  top:max(5vh,env(safe-area-inset-top));
  right:5vw;
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.weather-icon{
  width:48px;
  text-align:center;
  font-size:32px;
  line-height:1;
  filter:drop-shadow(0 0 8px rgba(70,170,255,.15));
}

.temperature{
  font-size:clamp(28px,4.5vw,44px);
  line-height:.9;
  font-weight:250;
}

.weather-info{
  margin-top:8px;
  color:#b8c4d0;
  font-size:12px;
  line-height:1.35;
}

/* =========================
   JOHANN
========================= */

.johann{
  position:absolute;
  z-index:10;
  left:50%;
  top:48%;
  width:min(73vw,650px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  touch-action:none;
}

#energy{
  display:block;
  width:100%;
  height:100%;
}

.shadow{
  position:absolute;
  z-index:8;
  left:50%;
  top:67.5%;
  width:min(46vw,440px);
  height:7%;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(
    ellipse,
    rgba(56,189,255,.20),
    rgba(0,104,255,.08) 33%,
    transparent 70%
  );
  filter:blur(13px);
}

.lightpoint{
  position:absolute;
  z-index:9;
  left:50%;
  top:67.5%;
  width:5px;
  height:5px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#dffcff;
  box-shadow:
    0 0 8px white,
    0 0 20px #45d8ff,
    0 0 45px #007cff;
}

/* =========================
   BEDIENUNG
========================= */

.controls{
  position:absolute;
  z-index:30;
  left:4vw;
  right:4vw;
  bottom:max(4vh,env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:16px;
}

.round{
  width:54px;
  height:54px;
  flex:0 0 54px;
  border-radius:50%;
  border:1px solid rgba(17,154,255,.75);
  background:rgba(2,11,21,.72);
  color:#16a9ff;
  display:grid;
  place-items:center;
  font-size:21px;
  box-shadow:
    inset 0 0 22px rgba(0,116,220,.08),
    0 0 15px rgba(0,102,200,.06);
  backdrop-filter:blur(12px);
}

.command{
  flex:1;
  height:54px;
  border-radius:30px;
  border:1px solid rgba(19,139,225,.55);
  background:rgba(1,8,17,.67);
  color:#899aad;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-size:14px;
  font-weight:300;
  backdrop-filter:blur(13px);
  box-shadow:inset 0 0 30px rgba(0,92,180,.04);
}

.dots{
  letter-spacing:5px;
  padding-left:5px;
}

/* =========================
   HANDY
========================= */

@media(max-width:700px){

  .clock{
    top:max(4.5vh,env(safe-area-inset-top));
    left:5.5vw;
  }

  .time{font-size:34px}

  .date{
    font-size:10px;
    margin-top:10px;
  }

  .brand{
    top:max(5vh,env(safe-area-inset-top));
  }

  .logo{font-size:22px}
  .tag{font-size:6px}

  .weather{
    top:max(5vh,env(safe-area-inset-top));
    right:5vw;
    gap:4px;
  }

  .weather-icon{
    font-size:25px;
    width:34px;
  }

  .temperature{font-size:25px}

  .weather-info{
    margin-top:5px;
    font-size:9px;
  }

  .johann{
    width:min(92vw,520px);
    top:47%;
  }

  .shadow,
  .lightpoint{
    top:65.5%;
  }

  .controls{
    left:14px;
    right:14px;
    gap:12px;
  }

  .round{
    width:47px;
    height:47px;
    flex-basis:47px;
  }

  .command{
    height:47px;
    padding:0 17px;
    font-size:11px;
  }

  .plant{
    opacity:.27;
  }
}
</style>
</head>

<body>

<main class="scene">

  <div class="back-wall">
    <i class="panel p1"></i>
    <i class="panel p2"></i>
    <i class="panel p3"></i>
    <i class="panel p4"></i>
  </div>

  <div class="window"></div>

  <div class="plant">
    <i class="stem"></i>
    <i class="leaf l1"></i>
    <i class="leaf l2"></i>
    <i class="leaf l3"></i>
    <i class="leaf l4"></i>
    <i class="leaf l5"></i>
  </div>

  <div class="floor"></div>
  <div class="floor-glow"></div>

  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </section>

  <header class="brand">
    <div class="logo">JOH<span class="a">A</span>NN</div>
    <div class="tag">KI MIT HERZ</div>
  </header>

  <section class="weather">
    <div class="weather-icon" id="weatherIcon">◌</div>

    <div>
      <div class="temperature" id="temperature">--°</div>
      <div class="weather-info">
        <span id="weatherCity">Bochum</span><br>
        <span id="weatherText">Wetter laden…</span>
      </div>
    </div>
  </section>

  <div class="johann" id="touchArea">
    <canvas id="energy"></canvas>
  </div>

  <div class="shadow"></div>
  <div class="lightpoint"></div>

  <section class="controls">
    <button class="round" aria-label="Johann">◉</button>

    <div class="command" id="message">
      Sag einfach, was du brauchst ...
    </div>

    <button class="round dots" aria-label="Mehr">•••</button>
  </section>

</main>

<script>

/* ===============================================
   UHR
=============================================== */

function updateClock(){

  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("de-DE",{
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("de-DE",{
      weekday:"short",
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);


/* ===============================================
   LIVE-WETTER BOCHUM
   Open-Meteo – kein API-Key nötig
=============================================== */

function weatherDescription(code){

  if(code === 0) return ["Klar","☀"];

  if([1,2].includes(code))
    return ["Leicht bewölkt","◒"];

  if(code === 3)
    return ["Bewölkt","☁"];

  if([45,48].includes(code))
    return ["Nebel","≋"];

  if([51,53,55,56,57].includes(code))
    return ["Nieselregen","☂"];

  if([61,63,65,66,67,80,81,82].includes(code))
    return ["Regen","☂"];

  if([71,73,75,77,85,86].includes(code))
    return ["Schnee","❄"];

  if([95,96,99].includes(code))
    return ["Gewitter","ϟ"];

  return ["Aktuell","◌"];
}

async function loadWeather(){

  const temperature =
    document.getElementById("temperature");

  const text =
    document.getElementById("weatherText");

  const icon =
    document.getElementById("weatherIcon");

  try{

    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=51.4818" +
      "&longitude=7.2162" +
      "&current=temperature_2m,weather_code" +
      "&timezone=Europe%2FBerlin";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Wetterdienst nicht erreichbar");
    }

    const data = await response.json();

    const temp =
      Math.round(data.current.temperature_2m);

    const code =
      data.current.weather_code;

    const result =
      weatherDescription(code);

    temperature.textContent = temp + "°";
    text.textContent = result[0];
    icon.textContent = result[1];

  }
  catch(error){

    temperature.textContent = "--°";
    text.textContent = "Keine Verbindung";
    icon.textContent = "◌";

    console.error(error);
  }
}

loadWeather();

/* alle 10 Minuten aktualisieren */
setInterval(loadWeather,600000);


/* ===============================================
   JOHANN ENERGY
=============================================== */

const canvas =
  document.getElementById("energy");

const ctx =
  canvas.getContext("2d");

const touchArea =
  document.getElementById("touchArea");

const message =
  document.getElementById("message");

let W,H,cx,cy;
let dpr =
  Math.min(window.devicePixelRatio || 1,2);

let active=false;
let holding=false;

let targetEnergy=0;
let energy=0;

let targetX=0;
let targetY=0;
let offsetX=0;
let offsetY=0;

let holdTimer;

const particles=[];
const paths=[];


/* ===============================================
   GRÖSSE
=============================================== */

function resize(){

  const r =
    canvas.getBoundingClientRect();

  W=r.width;
  H=r.height;

  canvas.width =
    Math.floor(W*dpr);

  canvas.height =
    Math.floor(H*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  cx=W/2;
  cy=H/2;

  createEnergy();
}

window.addEventListener(
  "resize",
  resize
);


/* ===============================================
   ENERGIE ERZEUGEN
=============================================== */

function createEnergy(){

  particles.length=0;
  paths.length=0;

  /* viele kleine Lichtpartikel */

  for(let i=0;i<170;i++){

    particles.push({

      angle:
        Math.random()*Math.PI*2,

      radius:
        W*(.16+Math.random()*.25),

      squash:
        .54+Math.random()*.34,

      speed:
        (.00008+Math.random()*.00055) *
        (Math.random()>.5?1:-1),

      size:
        .25+Math.random()*1.25,

      alpha:
        .10+Math.random()*.72,

      phase:
        Math.random()*Math.PI*2
    });
  }


  /* viele sehr feine Energiebahnen */

  for(let i=0;i<36;i++){

    paths.push({

      radius:
        W*(.20+Math.random()*.18),

      squash:
        .48+Math.random()*.46,

      rotation:
        Math.random()*Math.PI*2,

      speed:
        (.000035+Math.random()*.00020) *
        (Math.random()>.5?1:-1),

      start:
        Math.random()*Math.PI*2,

      length:
        .35+Math.random()*2.25,

      width:
        .25+Math.random()*.72,

      alpha:
        .055+Math.random()*.20
    });
  }
}


/* ===============================================
   WEICHER NEBEL IM INNEREN
=============================================== */

function drawAtmosphere(time){

  const x =
    cx+offsetX*.2;

  const y =
    cy+offsetY*.2;

  const pulse =
    1+Math.sin(time*.0012)*.025;

  const gradient =
    ctx.createRadialGradient(
      x,y,0,
      x,y,W*.31*pulse
    );

  gradient.addColorStop(
    0,
    "rgba(0,116,255,.095)"
  );

  gradient.addColorStop(
    .28,
    "rgba(0,91,205,.055)"
  );

  gradient.addColorStop(
    .65,
    "rgba(0,65,160,.018)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,50,120,0)"
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.arc(
    x,y,
    W*.31*pulse,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* ===============================================
   FEINE UMLAUFBAHNEN
=============================================== */

function drawPath(p,time){

  ctx.save();

  ctx.translate(
    cx+offsetX*.35,
    cy+offsetY*.35
  );

  ctx.rotate(
    p.rotation+
    time*p.speed
  );

  ctx.scale(
    1,
    p.squash
  );

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    p.radius*(1+energy*.025),
    p.start,
    p.start+p.length
  );

  ctx.strokeStyle =
    `rgba(44,158,235,${
      p.alpha+energy*.055
    })`;

  ctx.lineWidth =
    p.width*(1+energy*.25);

  ctx.shadowColor =
    "rgba(0,139,255,.5)";

  ctx.shadowBlur =
    2+energy*4;

  ctx.stroke();

  ctx.restore();
}


/* ===============================================
   HELLERE ENERGIESTRÖME
=============================================== */

function drawStreams(time){

  for(let i=0;i<9;i++){

    ctx.save();

    ctx.translate(
      cx+offsetX*.42,
      cy+offsetY*.42
    );

    const rotation =
      time *
      (.000025+i*.000006) +
      i*.72;

    ctx.rotate(rotation);

    ctx.scale(
      1,
      .55+(i%4)*.09
    );

    const radius =
      W*(.255+(i%5)*.018);

    const start =
      i*.77 +
      Math.sin(
        time*.0004+i
      )*.12;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      start,
      start+.55+(i%3)*.32
    );

    ctx.strokeStyle =
      `rgba(60,188,255,${
        .14+energy*.09
      })`;

    ctx.lineWidth =
      .45+(i%3)*.18;

    ctx.shadowColor =
      "#159fff";

    ctx.shadowBlur =
      5+energy*4;

    ctx.stroke();

    ctx.restore();
  }
}


/* ===============================================
   PARTIKEL
=============================================== */

function drawParticles(time){

  for(const p of particles){

    p.angle +=
      p.speed*(1+energy*.7);

    const wobble =
      Math.sin(
        time*.001+p.phase
      )*5;

    const x =
      cx+
      Math.cos(p.angle)*
      (p.radius+wobble)+
      offsetX*.28;

    const y =
      cy+
      Math.sin(p.angle)*
      (p.radius*p.squash)+
      offsetY*.28;

    let alpha=p.alpha;

    if(Math.sin(
      time*.002+p.phase
    )>.82){
      alpha*=1.7;
    }

    ctx.beginPath();

    ctx.fillStyle =
      `rgba(65,192,255,${alpha})`;

    ctx.shadowColor =
      "#1aaaff";

    ctx.shadowBlur =
      p.size>1 ? 7 : 3;

    ctx.arc(
      x,
      y,
      p.size*(1+energy*.18),
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* ===============================================
   KERN
   bewusst klein – kein Scheinwerfer mehr 😅
=============================================== */

function drawCore(time){

  const x =
    cx+offsetX*.52;

  const y =
    cy+offsetY*.52;

  const pulse =
    1+
    Math.sin(time*.002)*.06+
    energy*.12;

  /* sehr kleiner Halo */

  const halo =
    ctx.createRadialGradient(
      x,y,0,
      x,y,W*.075*pulse
    );

  halo.addColorStop(
    0,
    "rgba(190,250,255,.85)"
  );

  halo.addColorStop(
    .10,
    "rgba(62,215,255,.62)"
  );

  halo.addColorStop(
    .28,
    "rgba(0,147,255,.20)"
  );

  halo.addColorStop(
    1,
    "rgba(0,105,255,0)"
  );

  ctx.fillStyle=halo;

  ctx.beginPath();

  ctx.arc(
    x,y,
    W*.075*pulse,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* eigentlicher Energiekern */

  const radius =
    Math.max(
      3.8,
      W*.011
    )*(1+energy*.15);

  const core =
    ctx.createRadialGradient(
      x,y,0,
      x,y,radius*2.2
    );

  core.addColorStop(
    0,
    "#ffffff"
  );

  core.addColorStop(
    .20,
    "#bdfcff"
  );

  core.addColorStop(
    .48,
    "#35d9ff"
  );

  core.addColorStop(
    .72,
    "rgba(0,145,255,.75)"
  );

  core.addColorStop(
    1,
    "rgba(0,100,255,0)"
  );

  ctx.fillStyle=core;

  ctx.beginPath();

  ctx.arc(
    x,y,
    radius*2.2,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* ===============================================
   ANIMATION
=============================================== */

function animate(time){

  ctx.clearRect(
    0,0,W,H
  );

  offsetX +=
    (targetX-offsetX)*.055;

  offsetY +=
    (targetY-offsetY)*.055;

  energy +=
    (targetEnergy-energy)*.045;

  ctx.globalCompositeOperation =
    "lighter";

  drawAtmosphere(time);

  for(const p of paths){
    drawPath(p,time);
  }

  drawStreams(time);
  drawParticles(time);
  drawCore(time);

  ctx.globalCompositeOperation =
    "source-over";

  requestAnimationFrame(
    animate
  );
}


/* ===============================================
   TOUCH
=============================================== */

function pointerPosition(event){

  const r =
    touchArea.getBoundingClientRect();

  const x =
    event.clientX -
    (r.left+r.width/2);

  const y =
    event.clientY -
    (r.top+r.height/2);

  targetX =
    Math.max(
      -24,
      Math.min(
        24,
        x*.10
      )
    );

  targetY =
    Math.max(
      -24,
      Math.min(
        24,
        y*.10
      )
    );
}


touchArea.addEventListener(
  "pointerdown",
  event=>{

    active=true;
    holding=false;

    touchArea.setPointerCapture(
      event.pointerId
    );

    pointerPosition(event);

    targetEnergy=.65;

    message.textContent="Ja?";

    holdTimer=setTimeout(()=>{

      holding=true;
      targetEnergy=1.35;

      message.textContent=
        "Ich höre dir zu.";

    },550);
  }
);


touchArea.addEventListener(
  "pointermove",
  event=>{

    if(active){
      pointerPosition(event);
    }
  }
);


function release(){

  clearTimeout(holdTimer);

  active=false;
  holding=false;

  targetX=0;
  targetY=0;
  targetEnergy=0;

  setTimeout(()=>{

    if(!active){

      message.textContent =
        "Sag einfach, was du brauchst ...";
    }

  },800);
}


touchArea.addEventListener(
  "pointerup",
  release
);

touchArea.addEventListener(
  "pointercancel",
  release
);


/* START */

resize();
requestAnimationFrame(animate);

</script>

</html>
