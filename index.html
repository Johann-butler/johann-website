<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#03060b">

  <title>JOHANN — KI mit Herz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #35a7ff;
      --blue-light: #8dd5ff;
      --white: #f4f9ff;
      --muted: #7f93a8;
      --background: #03060b;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%,
          rgba(0, 119, 255, 0.12),
          transparent 32%),
        radial-gradient(circle at 50% 100%,
          rgba(0, 91, 255, 0.08),
          transparent 45%),
        var(--background);

      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      isolation: isolate;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(70, 160, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 160, 255, 0.08) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, transparent, black 35%, transparent);
    }

    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(0, 119, 255, 0.11);
      filter: blur(90px);
      z-index: -2;
      animation: breathe 5s ease-in-out infinite;
    }

    .brand {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand h1 {
      font-size: clamp(3.5rem, 14vw, 7rem);
      line-height: 0.9;
      letter-spacing: 0.16em;
      margin-left: 0.16em;
      font-weight: 750;
      text-shadow:
        0 0 25px rgba(80, 180, 255, 0.18),
        0 0 70px rgba(0, 110, 255, 0.12);
    }

    .brand p {
      margin-top: 17px;
      color: var(--blue-light);
      font-size: 0.72rem;
      letter-spacing: 0.55em;
      margin-left: 0.55em;
      font-weight: 600;
      opacity: 0.8;
    }

    .eye-area {
      position: relative;
      width: min(78vw, 360px);
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye-aura {
      position: absolute;
      width: 85%;
      height: 90px;
      border-radius: 50%;
      background: rgba(0, 145, 255, 0.2);
      filter: blur(38px);
      animation: aura 4s ease-in-out infinite;
    }

    .eye {
      position: relative;
      width: 100%;
      height: 125px;
      overflow: hidden;
      clip-path: polygon(
        0% 50%,
        14% 25%,
        34% 10%,
        50% 5%,
        66% 10%,
        86% 25%,
        100% 50%,
        86% 75%,
        66% 90%,
        50% 95%,
        34% 90%,
        14% 75%
      );

      background:
        radial-gradient(circle at center,
          #ffffff 0 5%,
          #92ddff 6% 11%,
          #168cff 12% 21%,
          #041b34 22% 31%,
          #73caff 32% 34%,
          rgba(8, 43, 77, 0.95) 35% 48%,
          rgba(4, 18, 31, 0.98) 58%);

      border: 1px solid rgba(130, 210, 255, 0.5);

      box-shadow:
        inset 0 0 25px rgba(80, 190, 255, 0.65),
        0 0 18px rgba(0, 160, 255, 0.75),
        0 0 55px rgba(0, 110, 255, 0.55);

      animation:
        eyePulse 3.8s ease-in-out infinite,
        blink 8s ease-in-out infinite;
    }

    .eye::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          115deg,
          transparent 20%,
          rgba(255,255,255,0.18) 43%,
          transparent 53%
        );
      animation: scan 5s linear infinite;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      left: 44%;
      top: 32%;
      filter: blur(2px);
      opacity: 0.7;
    }

    .status {
      margin-top: 42px;
      text-align: center;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid rgba(70, 170, 255, 0.2);
      border-radius: 999px;
      background: rgba(15, 40, 65, 0.28);
      backdrop-filter: blur(10px);

      color: #a8dfff;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4cc2ff;
      box-shadow: 0 0 12px #2aaeff;
      animation: dotPulse 2s infinite;
    }

    .message {
      margin-top: 22px;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    .subline {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-align: center;
    }

    .footer {
      position: absolute;
      bottom: 24px;
      color: rgba(150, 175, 200, 0.38);
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes aura {
      0%, 100% {
        transform: scale(0.88);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.95;
      }
    }

    @keyframes eyePulse {
      0%, 100% {
        filter: brightness(0.9);
      }
      50% {
        filter: brightness(1.25);
      }
    }

    @keyframes blink {
      0%, 45%, 49%, 53%, 100% {
        transform: scaleY(1);
      }
      47%, 51% {
        transform: scaleY(0.06);
      }
    }

    @keyframes scan {
      from {
        transform: translateX(-120%);
      }
      to {
        transform: translateX(120%);
      }
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-height: 650px) {
      .brand {
        margin-bottom: 20px;
      }

      .status {
        margin-top: 20px;
      }

      .footer {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="grid"></div>
    <div class="glow"></div>

    <header class="brand">
      <h1>JOHANN</h1>
      <p>KI MIT HERZ</p>
    </header>

    <section class="eye-area">
      <div class="eye-aura"></div>
      <div class="eye"></div>
    </section>

    <section class="status">

      <div class="online">
        <span class="dot"></span>
        System online
      </div>

      <div class="message">
        Ich bin da.
      </div>

      <div class="subline">
        Ein persönlicher Assistent entsteht.
      </div>

    </section>

    <footer class="footer">
      JOHANN · 2026
    </footer>

  </main>

</body>
</html>
