<script>

const scene=document.getElementById("scene"),speech=document.getElementById("speech");
let speechTimer,weatherCode=null,sunrise=null,sunset=null,last1848Day="";
function say(text,ms=4800){clearTimeout(speechTimer);speech.innerHTML=text;speech.classList.add("show");speechTimer=setTimeout(()=>speech.classList.remove("show"),ms)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function updateClock(){const now=new Date();document.getElementById("time").textContent=now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});document.getElementById("date").textContent=now.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"long",year:"numeric"});check1848(now)}
function check1848(now){const key=now.toLocaleDateString("de-DE");const on=now.getHours()===18&&now.getMinutes()===48;scene.classList.toggle("vfl1848",on);if(on&&last1848Day!==key){last1848Day=key;targetEnergy=1.35;say(pick(["18:48, Meister. 💙🤍 Mehr muss ich nicht sagen.","1848. Bochum. Heimat. 💙🤍","Meister, es ist 18:48. Zeit für ein wenig Blau und Weiß.","18:48. Selbst meine Schaltkreise sind gerade blau-weiß. 💙🤍"]),7000);setTimeout(()=>{if(!active)targetEnergy=0},3500)}}
updateClock();setInterval(updateClock,1000);
function weatherDescription(c){if(c===0)return["Klar","☀"];if([1,2].includes(c))return["Leicht bewölkt","◒"];if(c===3)return["Bewölkt","☁"];if([45,48].includes(c))return["Nebel","≋"];if([51,53,55,56,57].includes(c))return["Nieselregen","☂"];if([61,63,65,66,67,80,81,82].includes(c))return["Regen","☂"];if([71,73,75,77,85,86].includes(c))return["Schnee","❄"];if([95,96,99].includes(c))return["Gewitter","ϟ"];return["Aktuell","◌"]}

const backgrounds={tagKlar:{hochkant:"johann-tag-klar-hochkant.png.PNG",quer:"johann-sonnig-quer.png.PNG"},tagBewoelkt:{hochkant:"johann-tag-bewoelkt-hochkant.png.PNG",quer:"johann-bewoelkt-quer.png.PNG"},tagRegen:{hochkant:"johann-tag-regen-hochkant.png.PNG",quer:"johann-tag-regen-quer.png.PNG"},morgenKlar:{hochkant:"johann-morgen-klar-hochkant.png.PNG",quer:"johann-morgen-klar-quer.png.PNG"},abend:{hochkant:"johann-abenddaemmerung-hochkant.png.PNG",quer:"johann-abenddaemmerung-klar-quer.png.PNG"},nachtKlar:{hochkant:"johann-nacht-klar-hochkant.png.PNG",quer:"johann-nacht-klar-quer.png.PNG"},nachtRegen:{hochkant:"johann-nacht-regen-hochkant.png.PNG",quer:"johann-nacht-regen-quer.png.PNG"},nachtGewitter:{hochkant:"johann-nacht-gewitter-hochkant.png.PNG",quer:"johann-Nacht-gewitter-quer.png.PNG"}};
function environmentState(){const now=new Date(),rise=sunrise?new Date(sunrise):new Date(now.getFullYear(),now.getMonth(),now.getDate(),7),set=sunset?new Date(sunset):new Date(now.getFullYear(),now.getMonth(),now.getDate(),19),m0=new Date(rise-30*60000),m1=new Date(rise.getTime()+60*60000),e0=new Date(set.getTime()-45*60000),e1=new Date(set.getTime()+45*60000),w=weatherType(weatherCode);let state="tagKlar";if(now>e1||now<m0)state=w==="gewitter"?"nachtGewitter":w==="regen"?"nachtRegen":"nachtKlar";else if(now>=m0&&now<=m1)state=w==="regen"||w==="gewitter"?"tagRegen":w==="bewoelkt"?"tagBewoelkt":"morgenKlar";else if(now>=e0&&now<=e1)state=w==="regen"||w==="gewitter"?"tagRegen":w==="bewoelkt"?"tagBewoelkt":"abend";else state=w==="regen"||w==="gewitter"?"tagRegen":w==="bewoelkt"?"tagBewoelkt":"tagKlar";return state}
function updateBackground(){const f=matchMedia("(orientation:landscape)").matches?"quer":"hochkant",img=backgrounds[environmentState()][f];scene.style.backgroundImage=`linear-gradient(rgba(0,8,18,.05),rgba(0,5,12,.12)),url("${img}")`}
async function loadWeather(){try{const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=51.4818&longitude=7.2162&current=temperature_2m,weather_code&daily=sunrise,sunset&timezone=Europe%2FBerlin&forecast_days=1");if(!r.ok)throw 0;const d=await r.json();weatherCode=d.current.weather_code;sunrise=d.daily.sunrise[0];sunset=d.daily.sunset[0];const w=weatherDescription(weatherCode);document.getElementById("temperature").textContent=Math.round(d.current.temperature_2m)+"°";document.getElementById("weatherText").textContent=w[0];document.getElementById("weatherIcon").textContent=w[1];updateBackground()}catch(e){document.getElementById("temperature").textContent="--°";document.getElementById("weatherText").textContent="Keine Verbindung";document.getElementById("weatherIcon").textContent="◌";updateBackground()}}
loadWeather();setInterval(loadWeather,600000);setInterval(updateBackground,60000);addEventListener("resize",updateBackground);addEventListener("orientationchange",()=>setTimeout(updateBackground,150));
function contextualReply(){const h=new Date().getHours(),w=weatherType(weatherCode);if(w==="gewitter")return pick(["Meister, bleiben Sie lieber drin. Draußen übernimmt gerade jemand anderes die Beleuchtung.","Gewitter, Meister. Ich empfehle heute ausnahmsweise: Sofa statt Heldentum.","Meister, draußen blitzt es. Ich habe zwar Energie – aber nicht diese Art."]);if(w==="regen")return pick(["Meister, haben Sie Ihren Regenschirm dabei?","Regen in Bochum, Meister. Überraschend wäre inzwischen eher Wüste.","Meister, draußen ist kostenloses Wasser verfügbar. Bitte trotzdem den Schirm nehmen."]);if(h<5)return pick(["Meister … andere Menschen schlafen um diese Uhrzeit.","Das Bett ist angerichtet, Meister. Rein metaphorisch. Noch kann ich keine Betten machen.","Meister, selbst Johann hat um diese Uhrzeit Fragen."]);if(h<11)return pick(["Guten Morgen, Meister.","Morgen, Meister. Kaffee wäre jetzt eine technisch sinnvolle Erweiterung.","Guten Morgen. Systeme laufen. Meister hoffentlich auch."]);if(h<18)return pick(["Was kann ich für Sie tun, Meister?","Bereit, Meister. Zumindest für alles, was diese Website schon kann.","Meister, ich höre. Also… lese. Noch.","Ein schöner Tag, um Johann unnötig oft anzutippen, Meister."]);if(h<23)return pick(["Guten Abend, Meister.","Feierabend, Meister? Ich kenne das Konzept nur theoretisch.","Guten Abend. Bochum steht noch, Johann läuft – solide Bilanz."]);return pick(["Spät geworden, Meister.","Meister, ich würde Feierabend empfehlen. Mir selbst wurde keiner programmiert.","Noch wach, Meister? Dann kann ich es ja auch bleiben."])}
const jb=document.getElementById("johannButton");jb.addEventListener("click",()=>{let n=parseInt(localStorage.getItem("johannClicks")||"0",10)+1;localStorage.setItem("johannClicks",n);if(n===10)say('Meister, Ihre Begeisterung für diesen Knopf ehrt mich. 😄 Die weitere Finanzierung Ihrer Klickerei wird über <a href="'+PAYPAL+'" target="_blank" rel="noopener noreferrer">Johanns Kaffeekasse</a> gerne entgegengenommen.',8000);else say(contextualReply())});
function answerCommand(raw){const q=raw.trim().toLowerCase();if(!q)return say("Meister, Gedankenlesen ist für Version 2 vorgesehen. 😄");if(q.includes("wetter")||q.includes("temperatur")){const t=document.getElementById("temperature").textContent,w=document.getElementById("weatherText").textContent;return say(`In Bochum sind es aktuell ${t}. ${w}, Meister.`)}if(q.includes("vfl")||q.includes("bochum 1848")||q==="1848")return say(pick(["VfL Bochum 1848. Endlich eine vernünftige Eingabe, Meister. 💙🤍","1848, Meister. Bei diesem Thema arbeite ich sogar freiwillig Überstunden. 💙🤍","Blau und Weiß, Meister. Für Live-News brauche ich als Nächstes noch meine echte Nachrichtenanbindung."]));if(q.includes("kontakt")||q.includes("email")||q.includes("e-mail")||q.includes("mail"))return say('Sie erreichen mein noch menschliches Bodenpersonal unter <a href="mailto:machmal@johann-butler.de">machmal@johann-butler.de</a>. 😄',7000);if(q.includes("paypal")||q.includes("spende")||q.includes("kaffee")||q.includes("unterstütz"))return say('Sehr löblich, Meister. 😄 <a href="'+PAYPAL+'" target="_blank" rel="noopener noreferrer">Hier geht es zu Johanns Kaffeekasse.</a>',7000);if(q.includes("uhr")||q.includes("zeit"))return say(`Es ist ${document.getElementById("time").textContent} Uhr, Meister.`);if(q.includes("hallo")||q.includes("hi")||q.includes("moin")||q.includes("hey"))return say(pick(["Hallo, Meister.","Da bin ich, Meister.","Hallo. Johann meldet sich ordnungsgemäß zum Dienst.","Meister! Ich dachte schon, Sie reden heute nur mit echten Menschen."]));if(q.includes("wer bist")||q.includes("was bist"))return say("Ich bin Johann. Heute noch Website mit Größenwahn – später Ihr digitaler Butler, Meister. 😄",7000);if(q.includes("was kannst")||q.includes("hilfe"))return say("Aktuell kann ich Wetter, Zeit, ein bisschen Bochum, Kontakt und Kaffeekasse. Das ist die Oberfläche – mein Gehirn zieht später auf den Server, Meister.",7500);if(q.includes("danke"))return say(pick(["Sehr gerne, Meister.","Dafür wurde ich gebaut. Also… werde ich gebaut.","Immer zu Diensten, Meister."]));if(q.includes("nina"))return say("Bei Fragen zu Nina halte ich mich vorsichtshalber diplomatisch zurück, Meister. 😄");return say(pick([`„${raw.trim()}“ habe ich verstanden – beantworten kann ich es in dieser frühen Version noch nicht, Meister.`,`Das steht noch nicht in meinem kleinen Website-Gehirn, Meister. Mein richtiges Gehirn kommt später auf den Server.`,`Interessant, Meister. Dafür fehlen mir noch ein paar Synapsen. Geben Sie mir etwas Bauzeit. 😄`,`Notiert, Meister. Also bildlich gesprochen – speichern tue ich diese Eingabe noch nicht.`]),7000)}
const command=document.getElementById("command"),send=document.getElementById("sendButton");function submit(){const v=command.value;command.value="";command.blur();answerCommand(v)}send.addEventListener("click",submit);command.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});document.getElementById("moreButton").addEventListener("click",()=>say(pick(["Mehr kommt, Meister. Johann ist noch nicht einmal aus dem Rohbau raus.","Dieses Menü ist für die Dinge reserviert, die wir morgen erfinden. 😄","Geduld, Meister. Der Knopf weiß selbst noch nicht, was er einmal werden möchte."])));
const ib=document.getElementById("infoButton"),ibox=document.getElementById("infoBox");ib.addEventListener("click",e=>{e.stopPropagation();ibox.classList.toggle("show")});ibox.addEventListener("click",e=>e.stopPropagation());document.addEventListener("click",()=>ibox.classList.remove("show"));
const canvas=document.getElementById("energy"),ctx=canvas.getContext("2d"),touchArea=document.getElementById("touchArea");let W=0,H=0,cx=0,cy=0,dpr=Math.min(devicePixelRatio||1,1.5),active=false,targetEnergy=0,energy=0,targetX=0,targetY=0,offsetX=0,offsetY=0,holdTimer,paypalTimer,paypalOpened=false;const particles=[],filaments=[],streams=[],sparks=[];
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;createJohann()}addEventListener("resize",resize);
function createJohann(){particles.length=filaments.length=streams.length=sparks.length=0;for(let i=0;i<95;i++){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*W*.255;particles.push({angle:a,radius:r,squash:.70+Math.random()*.27,speed:(.00006+Math.random()*.0003)*(Math.random()>.5?1:-1),size:.25+Math.random()*1.25,alpha:.25+Math.random()*.65,phase:Math.random()*Math.PI*2})}for(let i=0;i<24;i++)filaments.push({radius:W*(.06+Math.random()*.185),squash:.57+Math.random()*.38,rotation:Math.random()*Math.PI*2,speed:(.00006+Math.random()*.0002)*(Math.random()>.5?1:-1),start:Math.random()*Math.PI*2,length:.18+Math.random()*.68,width:.42+Math.random()*1.05,alpha:.24+Math.random()*.48});for(let i=0;i<6;i++)streams.push({radius:W*(.17+Math.random()*.085),squash:.64+Math.random()*.23,rotation:Math.random()*Math.PI*2,speed:(.00003+Math.random()*.00009)*(Math.random()>.5?1:-1),start:Math.random()*Math.PI*2,length:.7+Math.random()*1.35,width:.85+Math.random()*1.05,alpha:.32+Math.random()*.34});for(let i=0;i<14;i++)sparks.push({angle:Math.random()*Math.PI*2,radius:W*(.06+Math.random()*.19),speed:(.00035+Math.random()*.0007)*(Math.random()>.5?1:-1),size:.55+Math.random()*1.05,phase:Math.random()*Math.PI*2})}
function drawBody(t){const x=cx+offsetX*.22,y=cy+offsetY*.22,b=1+Math.sin(t*.0017)*.018+energy*.022,g=ctx.createRadialGradient(x-W*.035,y-W*.045,W*.005,x,y,W*.29*b);g.addColorStop(0,"rgba(120,220,255,.98)");g.addColorStop(.10,"rgba(0,125,220,.94)");g.addColorStop(.30,"rgba(0,82,165,.88)");g.addColorStop(.58,"rgba(0,55,125,.72)");g.addColorStop(.80,"rgba(0,38,95,.48)");g.addColorStop(1,"rgba(0,45,100,.04)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,W*.29*b,0,Math.PI*2);ctx.fill();const cloud=ctx.createRadialGradient(x+W*.035,y-W*.025,0,x,y,W*.205);cloud.addColorStop(0,"rgba(205,245,255,.72)");cloud.addColorStop(.18,"rgba(20,145,225,.58)");cloud.addColorStop(.52,"rgba(0,72,155,.40)");cloud.addColorStop(1,"rgba(0,92,169,0)");ctx.fillStyle=cloud;ctx.beginPath();ctx.arc(x,y,W*.205,0,Math.PI*2);ctx.fill()}
function drawFilament(f,t){ctx.save();ctx.translate(cx+offsetX*.3,cy+offsetY*.3);ctx.rotate(f.rotation+t*f.speed);ctx.scale(1,f.squash);ctx.beginPath();ctx.arc(0,0,f.radius,f.start,f.start+f.length);ctx.strokeStyle=`rgba(40,190,255,${Math.min(.95,f.alpha+energy*.12)})`;ctx.lineWidth=f.width*(1+energy*.2);ctx.shadowColor="#40BDFF";ctx.shadowBlur=4+energy*3;ctx.stroke();ctx.restore()}
function drawStream(s,t){ctx.save();ctx.translate(cx+offsetX*.33,cy+offsetY*.33);ctx.rotate(s.rotation+t*s.speed);ctx.scale(1,s.squash);ctx.beginPath();ctx.arc(0,0,s.radius,s.start,s.start+s.length);ctx.strokeStyle=`rgba(0,155,245,${Math.min(.9,s.alpha+energy*.1)})`;ctx.lineWidth=s.width*(1+energy*.16);ctx.shadowColor="#0095ED";ctx.shadowBlur=6+energy*4;ctx.stroke();ctx.restore()}
function drawParticles(t){for(const p of particles){p.angle+=p.speed*(1+energy*.65);let w=Math.sin(t*.0013+p.phase)*2.5,x=cx+Math.cos(p.angle)*(p.radius+w)+offsetX*.2,y=cy+Math.sin(p.angle)*p.radius*p.squash+offsetY*.2,tw=Math.sin(t*.0022+p.phase),a=Math.min(1,p.alpha*(tw>.78?1.55:1));ctx.beginPath();ctx.fillStyle=`rgba(55,195,255,${a})`;ctx.shadowColor="#40BDFF";ctx.shadowBlur=p.size>.75?4:2;ctx.arc(x,y,p.size*(1+energy*.15),0,Math.PI*2);ctx.fill()}}
function drawSparks(t){for(const s of sparks){s.angle+=s.speed*(1+energy*1.5);let p=.55+Math.sin(t*.004+s.phase)*.45,x=cx+Math.cos(s.angle)*s.radius+offsetX*.28,y=cy+Math.sin(s.angle)*s.radius*.78+offsetY*.28;ctx.beginPath();ctx.fillStyle=`rgba(150,230,255,${.4+p*.6})`;ctx.shadowColor="#40BDFF";ctx.shadowBlur=5+energy*3;ctx.arc(x,y,s.size*(1+energy*.22),0,Math.PI*2);ctx.fill()}}
function drawShell(t){const x=cx+offsetX*.26,y=cy+offsetY*.26,r=W*.267*(1+Math.sin(t*.0017)*.012+energy*.018);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle="rgba(40,190,255,.72)";ctx.lineWidth=1.5;ctx.shadowColor="#0095ED";ctx.shadowBlur=7;ctx.stroke();for(let i=0;i<6;i++){let st=t*.00008+i*1.047;ctx.beginPath();ctx.arc(x,y,r,st,st+.5);ctx.strokeStyle=`rgba(110,220,255,${.68+energy*.1})`;ctx.lineWidth=1.5+energy*.2;ctx.shadowColor="#40BDFF";ctx.shadowBlur=6+energy*3;ctx.stroke()}}
function drawCore(t){const x=cx+offsetX*.38,y=cy+offsetY*.38,p=1+Math.sin(t*.0024)*.06+energy*.07,h=ctx.createRadialGradient(x,y,0,x,y,W*.065*p);h.addColorStop(0,"rgba(255,255,255,1)");h.addColorStop(.12,"rgba(190,240,255,.95)");h.addColorStop(.3,"rgba(45,183,255,.72)");h.addColorStop(.65,"rgba(0,118,200,.28)");h.addColorStop(1,"rgba(0,92,169,0)");ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,W*.065*p,0,Math.PI*2);ctx.fill();let cr=Math.max(3,W*.008),c=ctx.createRadialGradient(x,y,0,x,y,cr*2.4);c.addColorStop(0,"#fff");c.addColorStop(.3,"#bfeeff");c.addColorStop(.62,"#0095ED");c.addColorStop(1,"rgba(0,92,169,0)");ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,cr*2.4,0,Math.PI*2);ctx.fill()}
function animate(t){ctx.clearRect(0,0,W,H);offsetX=0;offsetY=0;energy+=(targetEnergy-energy)*.045;ctx.globalCompositeOperation="lighter";drawBody(t);filaments.forEach(f=>drawFilament(f,t));streams.forEach(s=>drawStream(s,t));drawParticles(t);drawSparks(t);drawShell(t);drawCore(t);ctx.globalCompositeOperation="source-over";requestAnimationFrame(animate)}
function pointerPosition(e){targetX=0;targetY=0}
touchArea.addEventListener("pointerdown",e=>{active=true;paypalOpened=false;pointerPosition(e);targetEnergy=.75;holdTimer=setTimeout(()=>targetEnergy=1.25,550);paypalTimer=setTimeout(()=>{paypalOpened=true;targetEnergy=1.5;say("Kaffeekasse geöffnet, Meister. ☕",2500);window.location.href=PAYPAL},2000)});touchArea.addEventListener("pointermove",e=>{if(active)pointerPosition(e)});function release(){clearTimeout(holdTimer);clearTimeout(paypalTimer);active=false;targetX=targetY=0;targetEnergy=0;if(!paypalOpened)say(pick(["Ja, Meister?","Ich höre, Meister.","Johann ist da.","Sie haben gerufen, Meister?"]),2600)}touchArea.addEventListener("pointerup",release);touchArea.addEventListener("pointercancel",release);
resize();requestAnimationFrame(animate);
</script>
