<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#01050b">

<title>JOHANN · KI MIT HERZ</title>

<style>
:root{
  --vfl:#005CA9;
  --vfl2:#0076C8;
  --vfl3:#0095ED;
  --light:#40BDFF;
  --white:#eef7ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01050b;
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}


/* =====================================================
   RAUM – HOCHKANT
===================================================== */

.scene{
  position:fixed;
  inset:0;
  overflow:hidden;

  background-image:
    linear-gradient(
      rgba(0,8,18,.05),
      rgba(0,5,12,.12)
    ),
    url("0BF4A026-7B00-4323-8619-BC514996DE1E.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}


/* =====================================================
   RAUM – QUERFORMAT
===================================================== */

@media (orientation:landscape){

  .scene{
    background-image:
      linear-gradient(
        rgba(0,8,18,.04),
        rgba(0,5,12,.10)
      ),
      url("AEB4EA74-98B5-4124-B294-B39011A5E935.png");
  }
}


.scene::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 25%,
      rgba(0,4,10,.035) 62%,
      rgba(0,3,8,.15) 100%
    );
}


/* =====================================================
   UHR
===================================================== */

.clock{
  position:absolute;
  z-index:20;
  top:max(4.3vh,env(safe-area-inset-top));
  left:5.5vw;
}

.time{
  font-size:clamp(36px,7vw,70px);
  font-weight:200;
  line-height:1;
  letter-spacing:-.02em;
  text-shadow:0 2px 15px rgba(0,0,0,.45);
}

.date{
  margin-top:10px;
  font-size:clamp(10px,1.8vw,17px);
  font-weight:300;
  color:#c1cad4;
  text-shadow:0 2px 10px #000;
}


/* =====================================================
   LOGO
===================================================== */

.brand{
  position:absolute;
  z-index:20;
  top:max(4.8vh,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
}

.logo{
  font-size:clamp(24px,4.6vw,46px);
  font-weight:250;
  letter-spacing:.30em;
  margin-left:.30em;
  text-shadow:0 2px 18px rgba(0,0,0,.55);
}

.logo .a{
  color:var(--vfl3);
  text-shadow:
    0 0 8px rgba(0,92,169,.9),
    0 0 20px rgba(0,92,169,.55);
}

.tag{
  margin-top:9px;
  margin-left:.45em;
  color:#57b4ef;
  font-size:clamp(7px,1vw,11px);
  letter-spacing:.48em;
}


/* =====================================================
   WETTER
===================================================== */

.weather{
  position:absolute;
  z-index:20;
  top:max(4.8vh,env(safe-area-inset-top));
  right:5vw;

  display:flex;
  gap:9px;
  align-items:flex-start;

  text-shadow:0 2px 12px #000;
}

.weather-icon{
  width:43px;
  font-size:29px;
  line-height:1;
  text-align:center;
  color:#d9edff;
}

.temperature{
  font-size:clamp(27px,4.5vw,45px);
  font-weight:250;
  line-height:.9;
}

.weather-info{
  margin-top:7px;
  font-size:12px;
  line-height:1.35;
  color:#d2dae3;
}


/* =====================================================
   JOHANN
===================================================== */

.johann{
  position:absolute;
  z-index:10;

  left:50%;
  top:48%;

  /* Größe bleibt wie in deiner jetzigen Version */
  width:min(57vw,510px);

  aspect-ratio:1;

  transform:translate(-50%,-50%);
  touch-action:none;
}

#energy{
  width:100%;
  height:100%;
  display:block;

  filter:
    drop-shadow(0 0 7px rgba(0,92,169,.52))
    drop-shadow(0 0 22px rgba(0,92,169,.22));
}


/* =====================================================
   REFLEXION
===================================================== */

.orb-reflection{
  position:absolute;
  z-index:8;

  left:50%;
  top:65%;

  transform:translateX(-50%);

  width:min(32vw,300px);
  height:7vh;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,92,169,.34) 0%,
      rgba(0,92,169,.14) 32%,
      rgba(0,92,169,.04) 55%,
      transparent 72%
    );

  filter:blur(12px);

  animation:reflectionPulse 4s ease-in-out infinite;
}

.orb-floor-point{
  position:absolute;
  z-index:9;

  left:50%;
  top:64.5%;

  width:4px;
  height:4px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#aee9ff;

  box-shadow:
    0 0 8px #dff8ff,
    0 0 18px #0088e8,
    0 0 35px #005CA9;
}

@keyframes reflectionPulse{

  0%,100%{
    opacity:.55;
    transform:translateX(-50%) scaleX(.88);
  }

  50%{
    opacity:.85;
    transform:translateX(-50%) scaleX(1.05);
  }
}


/* =====================================================
   UNTEN
===================================================== */

.slogan{
  position:absolute;
  z-index:20;

  left:0;
  right:0;

  bottom:13vh;

  text-align:center;

  font-size:clamp(7px,1.1vw,11px);

  letter-spacing:.35em;

  color:#d1dae3;

  text-shadow:0 2px 10px #000;
}

.slogan span{
  color:#2ea8f4;
}


.controls{
  position:absolute;
  z-index:30;

  left:4vw;
  right:4vw;

  bottom:max(3.7vh,env(safe-area-inset-bottom));

  display:flex;
  align-items:center;

  gap:14px;
}


.round{
  width:52px;
  height:52px;

  flex:0 0 52px;

  border-radius:50%;

  border:1px solid rgba(0,136,232,.75);

  background:rgba(0,7,17,.68);

  color:#20a9ff;

  display:grid;
  place-items:center;

  font-size:21px;

  backdrop-filter:blur(13px);

  box-shadow:
    inset 0 0 18px rgba(0,92,169,.12),
    0 0 15px rgba(0,92,169,.08);
}


/* =====================================================
   PAYPAL-EINGABEFELD 😅
===================================================== */

.command{
  flex:1;

  height:52px;

  border-radius:28px;

  border:1px solid rgba(0,136,232,.55);

  background:rgba(0,7,17,.62);

  color:#a5b2c1;

  display:flex;
  align-items:center;

  padding:0 21px;

  font-size:13px;
  font-weight:300;

  text-decoration:none;
  cursor:pointer;

  backdrop-filter:blur(14px);

  box-shadow:
    inset 0 0 25px rgba(0,92,169,.07);
}

.command:visited{
  color:#a5b2c1;
}

.command:active{
  border-color:#38b9ff;

  box-shadow:
    inset 0 0 28px rgba(0,92,169,.17),
    0 0 16px rgba(0,92,169,.18);
}

.dots{
  letter-spacing:4px;
  padding-left:4px;
}


/* =====================================================
   HANDY
===================================================== */

@media(max-width:700px){

  .clock{
    left:5vw;
  }

  .time{
    font-size:34px;
  }

  .date{
    font-size:10px;
  }

  .brand{
    top:max(5vh,env(safe-area-inset-top));
  }

  .logo{
    font-size:22px;
  }

  .tag{
    font-size:6px;
  }

  .weather{
    right:5vw;
  }

  .weather-icon{
    width:30px;
    font-size:24px;
  }

  .temperature{
    font-size:25px;
  }

  .weather-info{
    font-size:9px;
  }

  /*
    EXAKT die Kugelgröße,
    die dir jetzt gefällt.
  */

  .johann{
    width:min(69vw,390px);
    top:47%;
  }

  .orb-reflection{
    width:42vw;
    top:61.8%;
  }

  .orb-floor-point{
    top:61.5%;
  }

  .slogan{
    bottom:12vh;
    font-size:6px;
  }

  .controls{
    left:14px;
    right:14px;
    gap:11px;
  }

  .round{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .command{
    height:46px;
    padding:0 16px;
    font-size:11px;
  }
}


/* =====================================================
   QUERFORMAT
===================================================== */

@media(orientation:landscape){

  .johann{
    width:min(38vw,480px);
    top:49%;
  }

  .orb-reflection{
    width:26vw;
    top:69%;
  }

  .orb-floor-point{
    top:68.5%;
  }

  .slogan{
    bottom:13vh;
  }
}

</style>
</head>


<body>

<main class="scene">


  <section class="clock">

    <div
      class="time"
      id="time">
      --:--
    </div>

    <div
      class="date"
      id="date">
    </div>

  </section>


  <header class="brand">

    <div class="logo">
      JOH<span class="a">A</span>NN
    </div>

    <div class="tag">
      KI MIT HERZ
    </div>

  </header>


  <section class="weather">

    <div
      class="weather-icon"
      id="weatherIcon">
      ◌
    </div>

    <div>

      <div
        class="temperature"
        id="temperature">
        --°
      </div>

      <div class="weather-info">

        Bochum<br>

        <span id="weatherText">
          Wetter laden…
        </span>

      </div>

  <!-- JOHANN -->

  <div

    id="touchArea">

      aria-label="Johann aktivieren">

    </button>

      Das sieht aus wie das Eingabefeld,
      ist jetzt aber komplett klickbar.
    -->

    <a
      class="command"
      id="message"
      href="https://www.paypal.me/JohannButler"
      target="_blank"
      rel="noopener noreferrer">

    </a>


    <button
      class="round dots"
      aria-label="Mehr">
      •••
    </button>

  </section>


</main>


<script>

/* =====================================================
   UHR
===================================================== */

function updateClock(){

  const now=new Date();

  document.getElementById("time").textContent=
    now.toLocaleTimeString(
      "de-DE",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  document.getElementById("date").textContent=
    now.toLocaleDateString(
      "de-DE",
      {
        weekday:"short",
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );
}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =====================================================
   LIVE-WETTER BOCHUM
===================================================== */

function weatherDescription(code){

  if(code===0)
    return ["Klar","☀"];

  if([1,2].includes(code))
    return ["Leicht bewölkt","◒"];

  if(code===3)
    return ["Bewölkt","☁"];

  if([45,48].includes(code))
    return ["Nebel","≋"];

  if([51,53,55,56,57].includes(code))
    return ["Nieselregen","☂"];

  if(
    [61,63,65,66,67,80,81,82]
    .includes(code)
  )
    return ["Regen","☂"];

  if(
    [71,73,75,77,85,86]
    .includes(code)
  )
    return ["Schnee","❄"];

  if([95,96,99].includes(code))
    return ["Gewitter","ϟ"];

  return ["Aktuell","◌"];
}


async function loadWeather(){

  const tempElement=
    document.getElementById(
      "temperature"
    );

  const textElement=
    document.getElementById(
      "weatherText"
    );

  const iconElement=
    document.getElementById(
      "weatherIcon"
    );


  try{

    const url=
      "https://api.open-meteo.com/v1/forecast"+
      "?latitude=51.4818"+
      "&longitude=7.2162"+
      "&current=temperature_2m,weather_code"+
      "&timezone=Europe%2FBerlin";


    const response=
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Wetter nicht erreichbar"
      );
    }


    const data=
      await response.json();


    const temperature=
      Math.round(
        data.current.temperature_2m
      );


    const weather=
      weatherDescription(
        data.current.weather_code
      );


    tempElement.textContent=
      temperature+"°";


    textElement.textContent=
      weather[0];


    iconElement.textContent=
      weather[1];

  }

  catch(error){

    tempElement.textContent="--°";

    textElement.textContent=
      "Keine Verbindung";

    iconElement.textContent="◌";
  }
}


loadWeather();

setInterval(
  loadWeather,
  600000
);


/* =====================================================
   JOHANN ENERGY ENGINE
===================================================== */

const canvas=
  document.getElementById(
    "energy"
  );


const ctx=
  canvas.getContext("2d");


const touchArea=
  document.getElementById(
    "touchArea"
  );


const message=
  document.getElementById(
    "message"
  );


let W=0;
let H=0;

let cx=0;
let cy=0;


let dpr=
  Math.min(
    window.devicePixelRatio||1,
    2
  );


let active=false;

let targetEnergy=0;
let energy=0;

let targetX=0;
let targetY=0;

let offsetX=0;
let offsetY=0;

let holdTimer;


/*
  Vier unterschiedliche Ebenen.

  particles = Lichtpunkte
  filaments = kurze innere Energiefäden
  streams   = größere Wirbel
  sparks    = kleine schnelle Energiepunkte
*/

const particles=[];
const filaments=[];
const streams=[];
const sparks=[];


/* =====================================================
   GRÖSSE
===================================================== */

function resize(){

  const rect=
    canvas.getBoundingClientRect();


  W=rect.width;
  H=rect.height;


  canvas.width=
    Math.floor(
      W*dpr
    );


  canvas.height=
    Math.floor(
      H*dpr
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  cx=W/2;
  cy=H/2;


  createJohann();
}


window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   JOHANN AUFBAUEN
===================================================== */

function createJohann(){

  particles.length=0;
  filaments.length=0;
  streams.length=0;
  sparks.length=0;


  /*
    LICHTPUNKTE

    Viele Punkte,
    aber innerhalb der Kugel.
  */

  for(let i=0;i<150;i++){

    const angle=
      Math.random()*
      Math.PI*2;


    const radius=
      Math.sqrt(
        Math.random()
      )*
      W*.255;


    particles.push({

      angle,

      radius,

      squash:
        .72+
        Math.random()*.24,

      speed:
        (
          .00005+
          Math.random()*.00024
        )*
        (
          Math.random()>.5
          ?1
          :-1
        ),

      size:
        .20+
        Math.random()*.95,

      alpha:
        .10+
        Math.random()*.54,

      phase:
        Math.random()*
        Math.PI*2
    });
  }


  /*
    KURZE ENERGIEFÄDEN

    Das ist der entscheidende Unterschied.

    Viele kurze Linien INNERHALB,
    statt riesiger Ringe außen.
  */

  for(let i=0;i<38;i++){

    filaments.push({

      radius:
        W*(
          .075+
          Math.random()*.165
        ),

      squash:
        .60+
        Math.random()*.34,

      rotation:
        Math.random()*
        Math.PI*2,

      speed:
        (
          .000055+
          Math.random()*.00017
        )*
        (
          Math.random()>.5
          ?1
          :-1
        ),

      start:
        Math.random()*
        Math.PI*2,

      length:
        .16+
        Math.random()*.55,

      width:
        .28+
        Math.random()*.70,

      alpha:
        .12+
        Math.random()*.32
    });
  }


  /*
    NUR WENIGE GRÖSSERE STRÖME

    Diese geben der Kugel ihre Form,
    ohne wieder Saturn zu spielen.
  */

  for(let i=0;i<8;i++){

    streams.push({

      radius:
        W*(
          .185+
          Math.random()*.060
        ),

      squash:
        .67+
        Math.random()*.20,

      rotation:
        Math.random()*
        Math.PI*2,

      speed:
        (
          .000025+
          Math.random()*.000070
        )*
        (
          Math.random()>.5
          ?1
          :-1
        ),

      start:
        Math.random()*
        Math.PI*2,

      length:
        .65+
        Math.random()*1.15,

      width:
        .60+
        Math.random()*.65,

      alpha:
        .22+
        Math.random()*.22
    });
  }


  /*
    FUNKEN
  */

  for(let i=0;i<22;i++){

    sparks.push({

      angle:
        Math.random()*
        Math.PI*2,

      radius:
        W*(
          .07+
          Math.random()*.17
        ),

      speed:
        (
          .00030+
          Math.random()*.00055
        )*
        (
          Math.random()>.5
          ?1
          :-1
        ),

      size:
        .45+
        Math.random()*.75,

      phase:
        Math.random()*
        Math.PI*2
    });
  }
}


/* =====================================================
   GEFÜLLTER KUGELKÖRPER
===================================================== */

function drawBody(time){

  const x=
    cx+
    offsetX*.22;


  const y=
    cy+
    offsetY*.22;


  const breathe=
    1+
    Math.sin(
      time*.0017
    )*.018+
    energy*.022;


  /*
    Grundkörper:
    bewusst VfL-Blau.
  */

  const body=
    ctx.createRadialGradient(

      x-W*.035,
      y-W*.045,
      W*.01,

      x,
      y,
      W*.275*breathe
    );


  body.addColorStop(
    0,
    "rgba(0,136,232,.38)"
  );


  body.addColorStop(
    .20,
    "rgba(0,112,202,.34)"
  );


  body.addColorStop(
    .45,
    "rgba(0,92,169,.27)"
  );


  body.addColorStop(
    .70,
    "rgba(0,74,145,.17)"
  );


  body.addColorStop(
    .90,
    "rgba(0,56,115,.08)"
  );


  body.addColorStop(
    1,
    "rgba(0,45,100,0)"
  );


  ctx.fillStyle=body;


  ctx.beginPath();


  ctx.arc(
    x,
    y,
    W*.275*breathe,
    0,
    Math.PI*2
  );


  ctx.fill();


  /*
    Zweite Lichtwolke.

    Dadurch sieht die Kugel
    nicht leer aus.
  */

  const cloud=
    ctx.createRadialGradient(

      x+W*.035,
      y-W*.025,
      0,

      x,
      y,
      W*.19
    );


  cloud.addColorStop(
    0,
    "rgba(35,175,255,.22)"
  );


  cloud.addColorStop(
    .35,
    "rgba(0,125,220,.18)"
  );


  cloud.addColorStop(
    .72,
    "rgba(0,92,169,.09)"
  );


  cloud.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );


  ctx.fillStyle=cloud;


  ctx.beginPath();


  ctx.arc(
    x,
    y,
    W*.19,
    0,
    Math.PI*2
  );


  ctx.fill();
}


/* =====================================================
   INNERE ENERGIEFÄDEN
===================================================== */

function drawFilament(
  f,
  time
){

  ctx.save();


  ctx.translate(
    cx+offsetX*.30,
    cy+offsetY*.30
  );


  ctx.rotate(
    f.rotation+
    time*f.speed
  );


  ctx.scale(
    1,
    f.squash
  );


  ctx.beginPath();


  ctx.arc(
    0,
    0,
    f.radius,
    f.start,
    f.start+
    f.length
  );


  /*
    Mehrheit VfL-Blau.

    Einige Fäden dürfen
    heller aufblitzen.
  */

  ctx.strokeStyle=
    `rgba(
      0,
      ${115+Math.floor(f.alpha*70)},
      ${195+Math.floor(f.alpha*80)},
      ${f.alpha+energy*.10}
    )`;


  ctx.lineWidth=
    f.width*
    (
      1+
      energy*.18
    );


  ctx.shadowColor=
    "#0076C8";


  ctx.shadowBlur=
    4+
    energy*4;


  ctx.stroke();


  ctx.restore();
}


/* =====================================================
   GRÖSSERE STRÖME
===================================================== */

function drawStream(
  s,
  time
){

  ctx.save();


  ctx.translate(
    cx+offsetX*.33,
    cy+offsetY*.33
  );


  ctx.rotate(
    s.rotation+
    time*s.speed
  );


  ctx.scale(
    1,
    s.squash
  );


  ctx.beginPath();


  ctx.arc(
    0,
    0,
    s.radius,
    s.start,
    s.start+
    s.length
  );


  ctx.strokeStyle=
    `rgba(
      0,
      126,
      218,
      ${s.alpha+energy*.08}
    )`;


  ctx.lineWidth=
    s.width*
    (
      1+
      energy*.14
    );


  ctx.shadowColor=
    "#005CA9";


  ctx.shadowBlur=
    7+
    energy*5;


  ctx.stroke();


  ctx.restore();
}


/* =====================================================
   PARTIKEL
===================================================== */

function drawParticles(time){

  for(const p of particles){

    p.angle+=
      p.speed*
      (
        1+
        energy*.65
      );


    const wobble=
      Math.sin(
        time*.0013+
        p.phase
      )*
      2.5;


    const x=
      cx+
      Math.cos(p.angle)*
      (
        p.radius+
        wobble
      )+
      offsetX*.20;


    const y=
      cy+
      Math.sin(p.angle)*
      p.radius*
      p.squash+
      offsetY*.20;


    const twinkle=
      Math.sin(
        time*.0022+
        p.phase
      );


    const alpha=
      p.alpha*
      (
        twinkle>.84
        ?1.65
        :1
      );


    ctx.beginPath();


    ctx.fillStyle=
      `rgba(
        15,
        145,
        225,
        ${alpha}
      )`;


    ctx.shadowColor=
      "#0076C8";


    ctx.shadowBlur=
      p.size>.75
      ?5
      :2;


    ctx.arc(
      x,
      y,
      p.size*
      (
        1+
        energy*.15
      ),
      0,
      Math.PI*2
    );


    ctx.fill();
  }
}


/* =====================================================
   SCHNELLE FUNKEN
===================================================== */

function drawSparks(time){

  for(const s of sparks){

    s.angle+=
      s.speed*
      (
        1+
        energy*1.5
      );


    const pulse=
      .55+
      Math.sin(
        time*.004+
        s.phase
      )*.45;


    const x=
      cx+
      Math.cos(s.angle)*
      s.radius+
      offsetX*.28;


    const y=
      cy+
      Math.sin(s.angle)*
      s.radius*.78+
      offsetY*.28;


    ctx.beginPath();


    ctx.fillStyle=
      `rgba(
        45,
        183,
        255,
        ${.25+pulse*.55}
      )`;


    ctx.shadowColor=
      "#0095ED";


    ctx.shadowBlur=
      6+
      energy*5;


    ctx.arc(
      x,
      y,
      s.size*
      (
        1+
        energy*.22
      ),
      0,
      Math.PI*2
    );


    ctx.fill();
  }
}


/* =====================================================
   KUGELKANTE
===================================================== */

function drawShell(time){

  const x=
    cx+
    offsetX*.26;


  const y=
    cy+
    offsetY*.26;


  const radius=
    W*.252*
    (
      1+
      Math.sin(
        time*.0017
      )*.012+
      energy*.018
    );


  /*
    Sehr dezente Grundkante.
  */

  ctx.beginPath();


  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );


  ctx.strokeStyle=
    "rgba(0,92,169,.38)";


  ctx.lineWidth=1.05;


  ctx.shadowColor=
    "#005CA9";


  ctx.shadowBlur=
    7;


  ctx.stroke();


  /*
    Nur vier kurze Lichtsegmente.
    Keine riesigen Außenringe.
  */

  for(let i=0;i<4;i++){

    const start=
      time*.000075+
      i*1.57;


    ctx.beginPath();


    ctx.arc(
      x,
      y,
      radius,
      start,
      start+.48
    );


    ctx.strokeStyle=
      `rgba(
        0,
        145,
        237,
        ${.48+energy*.10}
      )`;


    ctx.lineWidth=
      1.2+
      energy*.15;


    ctx.shadowColor=
      "#0088e8";


    ctx.shadowBlur=
      8+
      energy*4;


    ctx.stroke();
  }
}


/* =====================================================
   KERN
===================================================== */

function drawCore(time){

  const x=
    cx+
    offsetX*.38;


  const y=
    cy+
    offsetY*.38;


  const pulse=
    1+
    Math.sin(
      time*.0024
    )*.06+
    energy*.07;


  /*
    Kleiner Halo.
    Kein Fernlicht.
  */

  const halo=
    ctx.createRadialGradient(
      x,
      y,
      0,

      x,
      y,
      W*.047*pulse
    );


  halo.addColorStop(
    0,
    "rgba(105,205,255,.72)"
  );


  halo.addColorStop(
    .18,
    "rgba(0,145,237,.48)"
  );


  halo.addColorStop(
    .50,
    "rgba(0,92,169,.15)"
  );


  halo.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );


  ctx.fillStyle=halo;


  ctx.beginPath();


  ctx.arc(
    x,
    y,
    W*.047*pulse,
    0,
    Math.PI*2
  );


  ctx.fill();


  const coreRadius=
    Math.max(
      2.2,
      W*.006
    );


  const core=
    ctx.createRadialGradient(
      x,
      y,
      0,

      x,
      y,
      coreRadius*2
    );


  core.addColorStop(
    0,
    "#dff8ff"
  );


  core.addColorStop(
    .25,
    "#4fbdff"
  );


  core.addColorStop(
    .58,
    "#0076C8"
  );


  core.addColorStop(
    1,
    "rgba(0,92,169,0)"
  );


  ctx.fillStyle=core;


  ctx.beginPath();


  ctx.arc(
    x,
    y,
    coreRadius*2,
    0,
    Math.PI*2
  );


  ctx.fill();
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(time){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  offsetX+=
    (
      targetX-
      offsetX
    )*
    .055;


  offsetY+=
    (
      targetY-
      offsetY
    )*
    .055;


  energy+=
    (
      targetEnergy-
      energy
    )*
    .045;


  ctx.globalCompositeOperation=
    "lighter";


  drawBody(time);


  /*
    Reihenfolge wichtig:
    Fäden liegen IN der Kugel.
  */

  for(const f of filaments){

    drawFilament(
      f,
      time
    );
  }


  for(const s of streams){

    drawStream(
      s,
      time
    );
  }


  drawParticles(time);

  drawSparks(time);

  drawShell(time);

  drawCore(time);


  ctx.globalCompositeOperation=
    "source-over";


  requestAnimationFrame(
    animate
  );
}


/* =====================================================
   TOUCH DER KUGEL
===================================================== */

function pointerPosition(event){

  const rect=
    touchArea
    .getBoundingClientRect();


  const x=
    event.clientX-
    (
      rect.left+
      rect.width/2
    );


  const y=
    event.clientY-
    (
      rect.top+
      rect.height/2
    );


  /*
    Weiterhin nur leichte Bewegung.
    Größe verändert sich kaum.
  */

  targetX=
    Math.max(
      -14,
      Math.min(
        14,
        x*.055
      )
    );


  targetY=
    Math.max(
      -14,
      Math.min(
        14,
        y*.055
      )
    );
}


touchArea.addEventListener(
  "pointerdown",
  event=>{

    active=true;


    touchArea.setPointerCapture(
      event.pointerId
    );


    pointerPosition(
      event
    );


    /*
      Mehr Energie,
      aber nicht größer.
    */

    targetEnergy=.60;


    /*
      Der sichtbare PayPal-Link
      wird hier NICHT verändert.
      Nur die Kugel reagiert.
    */

    holdTimer=
      setTimeout(
        ()=>{

          targetEnergy=1.15;

        },
        550
      );
  }
);


touchArea.addEventListener(
  "pointermove",
  event=>{

    if(active){

      pointerPosition(
        event
      );
    }
  }
);


function release(){

  clearTimeout(
    holdTimer
  );


  active=false;


  targetX=0;
  targetY=0;

  targetEnergy=0;
}


touchArea.addEventListener(
  "pointerup",
  release
);


touchArea.addEventListener(
  "pointercancel",
  release
);


/* =====================================================
   START
===================================================== */

resize();

requestAnimationFrame(
  animate
);

</script>
