<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060d">
<title>JOHANN · KI MIT HERZ</title>

<style>
:root{
  --blue:#078dff;
  --cyan:#55d9ff;
  --white:#edf7ff;
  --muted:#8da2b8;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01040a;
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}

/* ---------- RAUM ---------- */

.room{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 48%,rgba(0,76,160,.16),transparent 38%),
    linear-gradient(180deg,#020914 0%,#020811 58%,#01040a 100%);
}

/* linke dunkle Wand / Pflanzenecke */
.left-wall{
  position:absolute;
  inset:0 67% 0 0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.7),rgba(3,10,19,.15));
}

.plant{
  position:absolute;
  left:-3vw;
  bottom:21vh;
  width:30vw;
  height:34vh;
  opacity:.25;
  filter:blur(5px);
}

.plant::before,
.plant::after{
  content:"";
  position:absolute;
  left:32%;
  bottom:0;
  width:25%;
  height:38%;
  background:linear-gradient(90deg,#061008,#102518,#050b07);
  clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

.leaf{
  position:absolute;
  left:40%;
  bottom:30%;
  width:38%;
  height:12%;
  border-radius:100% 0 100% 0;
  background:#15301d;
  transform-origin:left center;
}

.leaf:nth-child(1){transform:rotate(-58deg) translateX(-40px)}
.leaf:nth-child(2){transform:rotate(-25deg) translateX(-30px)}
.leaf:nth-child(3){transform:rotate(18deg)}
.leaf:nth-child(4){transform:rotate(52deg)}
.leaf:nth-child(5){bottom:46%;transform:rotate(-42deg)}
.leaf:nth-child(6){bottom:53%;transform:rotate(34deg)}

/* Fenster rechts */
.window{
  position:absolute;
  right:-2%;
  top:0;
  width:34%;
  height:71%;
  border-left:2px solid rgba(63,126,180,.11);
  background:
    linear-gradient(90deg,rgba(5,16,30,.7),rgba(5,20,38,.28)),
    radial-gradient(circle at 60% 52%,rgba(15,76,130,.20),transparent 45%);
  filter:blur(.2px);
}

.window::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 48%,rgba(72,130,180,.11) 49%,rgba(72,130,180,.11) 50%,transparent 51%),
    linear-gradient(180deg,transparent 48%,rgba(72,130,180,.08) 49%,rgba(72,130,180,.08) 50%,transparent 51%);
}

.city{
  position:absolute;
  right:0;
  bottom:28%;
  width:35%;
  height:22%;
  opacity:.20;
  filter:blur(5px);
  background:
    radial-gradient(circle at 8% 72%,#ffd891 0 2px,transparent 3px),
    radial-gradient(circle at 22% 54%,#8bc9ff 0 2px,transparent 3px),
    radial-gradient(circle at 36% 80%,#ffd891 0 2px,transparent 3px),
    radial-gradient(circle at 54% 63%,#a8d8ff 0 2px,transparent 3px),
    radial-gradient(circle at 70% 76%,#ffd891 0 2px,transparent 3px),
    radial-gradient(circle at 87% 50%,#7cc6ff 0 2px,transparent 3px);
}

/* Boden wie im Referenzbild – keine Tron-Kacheln */
.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:36%;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(0,107,220,.15),transparent 46%),
    linear-gradient(180deg,rgba(3,11,20,.55),#01040a 78%);
  border-top:1px solid rgba(45,119,185,.09);
}

.floor::after{
  content:"";
  position:absolute;
  left:24%;
  right:24%;
  top:-1px;
  height:78%;
  background:linear-gradient(180deg,rgba(10,123,255,.12),transparent);
  clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
  filter:blur(24px);
}

/* ---------- UI ---------- */

.clock{
  position:absolute;
  z-index:20;
  left:max(5vw,22px);
  top:max(4vh,env(safe-area-inset-top));
}

.time{
  font-size:clamp(42px,8vw,72px);
  font-weight:200;
  letter-spacing:.01em;
  line-height:1;
}

.date{
  margin-top:8px;
  color:#b6c2ce;
  font-size:clamp(13px,2.2vw,19px);
  font-weight:300;
}

.greeting{
  margin-top:34px;
  max-width:230px;
  font-size:clamp(16px,2.6vw,23px);
  line-height:1.4;
  font-weight:300;
}

.greeting::after{
  content:"";
  display:block;
  width:45px;
  height:2px;
  margin-top:15px;
  background:#18a9ff;
  box-shadow:0 0 10px rgba(0,169,255,.5);
}

.brand{
  position:absolute;
  z-index:20;
  top:max(5vh,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
}

.logo{
  font-size:clamp(26px,5vw,48px);
  font-weight:250;
  letter-spacing:.32em;
  margin-left:.32em;
}

.logo .a{
  color:#159eff;
  text-shadow:0 0 18px rgba(0,145,255,.65);
}

.tagline{
  margin-top:8px;
  margin-left:.42em;
  color:#42aef7;
  font-size:clamp(8px,1.2vw,12px);
  letter-spacing:.48em;
}

.weather{
  position:absolute;
  z-index:20;
  right:max(5vw,22px);
  top:max(5vh,env(safe-area-inset-top));
  display:flex;
  gap:14px;
  align-items:flex-start;
}

.cloud{
  width:43px;
  height:23px;
  margin-top:9px;
  border:2px solid #b9d7f5;
  border-radius:20px;
  position:relative;
  opacity:.9;
}

.cloud::before{
  content:"";
  position:absolute;
  width:19px;
  height:19px;
  left:7px;
  top:-11px;
  border:2px solid #b9d7f5;
  border-bottom:0;
  border-radius:50% 50% 0 0;
  background:#06101d;
}

.temp{
  font-size:clamp(29px,5vw,48px);
  font-weight:250;
  line-height:1;
}

.weatherText{
  margin-top:5px;
  color:#c5d0dc;
  font-size:13px;
  line-height:1.3;
}

/* ---------- JOHANN ---------- */

.johann-wrap{
  position:absolute;
  z-index:10;
  left:50%;
  top:49%;
  width:min(62vw,620px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  touch-action:none;
}

#energy{
  width:100%;
  height:100%;
  display:block;
  filter:
    drop-shadow(0 0 12px rgba(0,132,255,.35))
    drop-shadow(0 0 36px rgba(0,85,255,.18));
}

.reflection{
  position:absolute;
  z-index:7;
  left:50%;
  top:72%;
  width:min(48vw,470px);
  height:12vh;
  transform:translateX(-50%);
  border-radius:50%;
  background:
    radial-gradient(ellipse,
      rgba(49,183,255,.30) 0%,
      rgba(0,107,255,.12) 25%,
      rgba(0,64,150,.04) 47%,
      transparent 70%);
  filter:blur(15px);
  opacity:.7;
  animation:reflect 4s ease-in-out infinite;
}

.floor-point{
  position:absolute;
  z-index:8;
  left:50%;
  top:70.8%;
  width:5px;
  height:5px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#bdf7ff;
  box-shadow:
    0 0 8px #fff,
    0 0 22px #21bfff,
    0 0 60px #007fff;
}

/* ---------- UNTEN ---------- */

.motto{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:11.5vh;
  text-align:center;
  color:#72869b;
  font-size:clamp(8px,1.1vw,12px);
  letter-spacing:.36em;
}

.motto span{color:#27aaff}

.command{
  position:absolute;
  z-index:30;
  left:4vw;
  right:4vw;
  bottom:max(3vh,env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:14px;
}

.mic,
.more{
  flex:0 0 52px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(16,153,255,.58);
  background:rgba(1,12,25,.56);
  box-shadow:inset 0 0 20px rgba(0,91,180,.08);
  color:#1caaff;
  display:grid;
  place-items:center;
  font-size:23px;
  backdrop-filter:blur(12px);
}

.input{
  flex:1;
  height:52px;
  border-radius:28px;
  border:1px solid rgba(20,126,215,.43);
  background:rgba(1,9,20,.48);
  color:#8fa5ba;
  display:flex;
  align-items:center;
  padding:0 22px;
  font-size:14px;
  font-weight:300;
  backdrop-filter:blur(14px);
  box-shadow:
    inset 0 0 25px rgba(0,91,180,.06),
    0 0 22px rgba(0,72,150,.04);
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  white-space:nowrap;
  margin-left:8px;
  color:#d2dae2;
  font-size:9px;
  letter-spacing:.28em;
}

.green{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00e99a;
  box-shadow:0 0 13px #00e99a;
}

@keyframes reflect{
  0%,100%{opacity:.48;transform:translateX(-50%) scaleX(.88)}
  50%{opacity:.76;transform:translateX(-50%) scaleX(1.05)}
}

/* ---------- HANDY ---------- */

@media(max-width:700px){
  .clock{
    top:max(3.3vh,env(safe-area-inset-top));
  }

  .time{font-size:34px}
  .date{font-size:11px}

  .greeting{
    margin-top:20px;
    font-size:13px;
    max-width:125px;
  }

  .brand{
    top:max(4vh,env(safe-area-inset-top));
  }

  .logo{font-size:24px}
  .tagline{font-size:7px}

  .weather{
    top:max(4vh,env(safe-area-inset-top));
    gap:7px;
  }

  .cloud{
    transform:scale(.7);
    transform-origin:right top;
  }

  .temp{font-size:25px}
  .weatherText{font-size:9px}

  .johann-wrap{
    top:47%;
    width:min(91vw,470px);
  }

  .reflection{
    top:66%;
    width:70vw;
  }

  .floor-point{top:65.5%}

  .motto{
    bottom:12.5vh;
    font-size:7px;
  }

  .command{
    left:14px;
    right:14px;
  }

  .mic,.more{
    width:45px;
    height:45px;
    flex-basis:45px;
  }

  .input{
    height:45px;
    font-size:11px;
    padding:0 15px;
  }

  .status{
    display:none;
  }
}

@media(max-height:720px){
  .greeting{display:none}
  .johann-wrap{width:min(68vh,88vw)}
  .motto{display:none}
}
</style>
</head>

<body>

<main class="room">

  <div class="left-wall"></div>

  <div class="plant">
    <i class="leaf"></i><i class="leaf"></i><i class="leaf"></i>
    <i class="leaf"></i><i class="leaf"></i><i class="leaf"></i>
  </div>

  <div class="window"></div>
  <div class="city"></div>
  <div class="floor"></div>

  <section class="clock">
    <div class="time" id="time">19:24</div>
    <div class="date" id="date">Mi, 22. Januar 2025</div>
    <div class="greeting">„Schön, dass<br>du da bist, Björn.“</div>
  </section>

  <header class="brand">
    <div class="logo">JOH<span class="a">A</span>NN</div>
    <div class="tagline">KI MIT HERZ</div>
  </header>

  <section class="weather">
    <div class="cloud"></div>
    <div>
      <div class="temp">4°</div>
      <div class="weatherText">Bochum<br>Bewölkt</div>
    </div>
  </section>

  <div class="johann-wrap" id="touchArea">
    <canvas id="energy"></canvas>
  </div>

  <div class="reflection"></div>
  <div class="floor-point"></div>

  <div class="motto">
    <span>ZUHAUSE.</span> INTELLIGENTER. GEMEINSAM.
  </div>

  <section class="command">
    <button class="mic" aria-label="Johann aktivieren">◉</button>
    <div class="input" id="message">Sag einfach, was du brauchst ...</div>
    <button class="more" aria-label="Mehr">•••</button>
    <div class="status">ALLES GUT <i class="green"></i></div>
  </section>

</main>

<script>
/* ==========================================================
   UHR
========================================================== */

function updateClock(){
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("de-DE",{
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("de-DE",{
      weekday:"short",
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);


/* ==========================================================
   JOHANN CANVAS
========================================================== */

const canvas = document.getElementById("energy");
const ctx = canvas.getContext("2d");
const touchArea = document.getElementById("touchArea");
const message = document.getElementById("message");

let W=0,H=0,cx=0,cy=0;
let dpr=Math.min(window.devicePixelRatio || 1,2);

let pointerX=0;
let pointerY=0;
let targetX=0;
let targetY=0;

let energy=0;
let targetEnergy=0;

let touching=false;
let holding=false;
let holdTimer=null;

const stars=[];
const trails=[];


/* ---------- GRÖSSE ---------- */

function resize(){
  const rect=canvas.getBoundingClientRect();

  W=rect.width;
  H=rect.height;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  cx=W/2;
  cy=H/2;

  createParticles();
}

window.addEventListener("resize",resize);


/* ---------- PARTIKEL ---------- */

function createParticles(){
  stars.length=0;

  const count=Math.max(90,Math.floor(W*.32));

  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const radius=W*(.17+Math.random()*.29);

    stars.push({
      angle,
      radius,
      speed:(Math.random()*.0016+.00025)*
        (Math.random()>.5?1:-1),

      size:Math.random()*1.35+.25,
      alpha:Math.random()*.75+.15,
      wobble:Math.random()*Math.PI*2
    });
  }

  trails.length=0;

  for(let i=0;i<18;i++){
    trails.push({
      radius:W*(.25+Math.random()*.14),
      squash:.48+Math.random()*.42,
      rotation:Math.random()*Math.PI,
      speed:(.00018+Math.random()*.00055)*
        (Math.random()>.5?1:-1),
      width:.35+Math.random()*1.1,
      alpha:.12+Math.random()*.34,
      phase:Math.random()*Math.PI*2,
      length:.7+Math.random()*2.5
    });
  }
}


/* ---------- ENERGIEBAHN ---------- */

function drawTrail(t,time){

  const rotation=t.rotation+time*t.speed;

  ctx.save();

  ctx.translate(
    cx+pointerX*.18,
    cy+pointerY*.18
  );

  ctx.rotate(rotation);
  ctx.scale(1,t.squash);

  ctx.beginPath();

  const start=t.phase+Math.sin(time*.0003+t.phase)*.3;

  ctx.arc(
    0,0,
    t.radius*(1+energy*.025),
    start,
    start+t.length
  );

  const glow=
    t.alpha+
    energy*.15;

  ctx.strokeStyle=`rgba(38,161,255,${glow})`;
  ctx.lineWidth=t.width*(1+energy*.5);

  ctx.shadowColor="rgba(0,139,255,.85)";
  ctx.shadowBlur=5+energy*11;

  ctx.stroke();

  ctx.restore();
}


/* ---------- ZENTRUM ---------- */

function drawCore(time){

  const pulse=
    1+
    Math.sin(time*.0023)*.045+
    energy*.18;

  const x=cx+pointerX*.38;
  const y=cy+pointerY*.38;

  const halo=ctx.createRadialGradient(
    x,y,0,
    x,y,W*.22*pulse
  );

  halo.addColorStop(0,
    `rgba(215,250,255,${.90+energy*.1})`);

  halo.addColorStop(.025,
    "rgba(110,225,255,.96)");

  halo.addColorStop(.08,
    "rgba(0,149,255,.75)");

  halo.addColorStop(.22,
    "rgba(0,94,255,.20)");

  halo.addColorStop(.55,
    "rgba(0,65,200,.045)");

  halo.addColorStop(1,
    "rgba(0,40,140,0)");

  ctx.fillStyle=halo;

  ctx.beginPath();
  ctx.arc(x,y,W*.22*pulse,0,Math.PI*2);
  ctx.fill();


  /* winziger heller Kern */

  const core=ctx.createRadialGradient(
    x,y,0,
    x,y,10+energy*6
  );

  core.addColorStop(0,"white");
  core.addColorStop(.15,"#dfffff");
  core.addColorStop(.38,"#52d9ff");
  core.addColorStop(.7,"rgba(0,137,255,.65)");
  core.addColorStop(1,"rgba(0,110,255,0)");

  ctx.fillStyle=core;
  ctx.beginPath();
  ctx.arc(x,y,11+energy*7,0,Math.PI*2);
  ctx.fill();
}


/* ---------- PARTIKEL ---------- */

function drawParticles(time){

  for(const p of stars){

    p.angle+=p.speed*(1+energy*2);

    const wobble=
      Math.sin(time*.001+p.wobble)*7;

    const x=
      cx+
      Math.cos(p.angle)*
      (p.radius+wobble)+
      pointerX*.13;

    const y=
      cy+
      Math.sin(p.angle)*
      (p.radius*.72+wobble*.3)+
      pointerY*.13;

    ctx.beginPath();

    ctx.fillStyle=
      `rgba(93,199,255,${p.alpha})`;

    ctx.shadowColor="#159fff";
    ctx.shadowBlur=4;

    ctx.arc(
      x,y,
      p.size*(1+energy*.45),
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}


/* ---------- EIN PAAR HELLE LICHTSTRÖME ---------- */

function drawBrightStreams(time){

  for(let i=0;i<5;i++){

    const rot=
      time*(.00010+i*.000018)+
      i*1.21;

    ctx.save();
    ctx.translate(
      cx+pointerX*.22,
      cy+pointerY*.22
    );

    ctx.rotate(rot);

    ctx.scale(
      1,
      .62+i*.035
    );

    ctx.beginPath();

    const radius=W*(.285+i*.011);

    ctx.arc(
      0,0,
      radius,
      .2+i*.53,
      1.65+i*.53
    );

    ctx.strokeStyle=
      `rgba(65,194,255,${.27+energy*.22})`;

    ctx.lineWidth=
      .75+energy*.65;

    ctx.shadowColor="#008fff";
    ctx.shadowBlur=10+energy*10;

    ctx.stroke();

    ctx.restore();
  }
}


/* ---------- FRAME ---------- */

function animate(time){

  ctx.clearRect(0,0,W,H);

  pointerX+=(targetX-pointerX)*.065;
  pointerY+=(targetY-pointerY)*.065;
  energy+=(targetEnergy-energy)*.055;

  ctx.globalCompositeOperation="lighter";

  drawCore(time);

  for(const t of trails){
    drawTrail(t,time);
  }

  drawBrightStreams(time);
  drawParticles(time);

  ctx.globalCompositeOperation="source-over";

  requestAnimationFrame(animate);
}


/* ==========================================================
   BERÜHRUNG
========================================================== */

function moveTarget(event){

  const r=touchArea.getBoundingClientRect();

  const px=
    event.clientX-(r.left+r.width/2);

  const py=
    event.clientY-(r.top+r.height/2);

  targetX=
    Math.max(-26,Math.min(26,px*.12));

  targetY=
    Math.max(-26,Math.min(26,py*.12));
}


touchArea.addEventListener("pointerdown",event=>{

  touching=true;
  holding=false;

  touchArea.setPointerCapture(event.pointerId);

  moveTarget(event);

  targetEnergy=.75;

  message.textContent="Ja?";

  holdTimer=setTimeout(()=>{

    holding=true;
    targetEnergy=1.45;

    message.textContent="Ich höre.";

  },550);
});


touchArea.addEventListener("pointermove",event=>{

  if(touching){
    moveTarget(event);
  }

});


function release(){

  clearTimeout(holdTimer);

  touching=false;
  holding=false;

  targetX=0;
  targetY=0;
  targetEnergy=0;

  setTimeout(()=>{
    if(!touching){
      message.textContent=
        "Sag einfach, was du brauchst ...";
    }
  },850);
}


touchArea.addEventListener("pointerup",release);
touchArea.addEventListener("pointercancel",release);


/* ---------- START ---------- */

resize();
requestAnimationFrame(animate);

</script>

</body>
</html>
