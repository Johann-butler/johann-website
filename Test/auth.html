<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Johann – privater Testzugang</title><style>body{background:#071426;color:#e9f7ff;font:17px system-ui;max-width:550px;margin:30px auto;padding:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:12px;font:inherit}input{background:#102b49;color:white;border:1px solid #448aca}button{background:#227ec6;color:white;border:0}section{padding:16px;border:1px solid #3475a7;border-radius:20px;margin:15px 0}small{color:#b4cde4}#status{white-space:pre-wrap}</style><h1>🔐 Johann – Testzugang</h1><p>Nur für den privaten Test. Die laufende Johann-Webseite bleibt unverändert.</p><section><label>Test-Worker-Adresse<input id="url" placeholder="https://johann-auth-test.DEINNAME.workers.dev/"></label><label>E-Mail<input id="email" type="email" autocomplete="email"></label><button id="request">Code anfordern</button><label>6-stelliger Code<input id="code" inputmode="numeric" maxlength="6"></label><button id="verify">Anmelden</button><button id="logout">Abmelden</button></section><section><h2>🔒 Verschlüsseltes Archiv</h2><p><small>Dein Passwort verlässt dieses Gerät nicht. Ohne Passwort sind die Daten auch für dich nicht wiederherstellbar. Das Archiv ist noch NICHT mit Johanns Chat verknüpft.</small></p><label>Archiv-Passwort (mindestens 14 Zeichen)<input id="pass" type="password" autocomplete="new-password"></label><label>Private Testnotiz<textarea id="note" rows="5" style="width:100%" placeholder="Nur Testdaten, keine echten Geheimnisse"></textarea></label><button id="save">Lokal verschlüsseln und speichern</button><button id="load">Archiv entschlüsseln</button><button id="del">Archiv löschen</button><button id="deleteAccount">Testkonto endgültig löschen</button></section><p id="status" role="status"></p><script>
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
let token=sessionStorage.getItem('johann-test-token')||'';
async function call(action,body={}){const url=$('url').value.trim();if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev\/?$/i.test(url))throw Error('Bitte die vollständige workers.dev-Testadresse eingeben.');sessionStorage.setItem('johann-test-url',url);const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}
$('url').value=sessionStorage.getItem('johann-test-url')||'';
async function run(f){try{status('Einen Moment …');await f()}catch(e){status('⚠️ '+e.message)}}
$('request').onclick=()=>run(async()=>{const x=await call('auth_request',{email:$('email').value});status(x.message)});
$('verify').onclick=()=>run(async()=>{const x=await call('auth_verify',{email:$('email').value,code:$('code').value});token=x.token;sessionStorage.setItem('johann-test-token',token);status('Angemeldet als '+x.email+' (24 Stunden).')});
$('logout').onclick=()=>run(async()=>{await call('auth_logout');token='';sessionStorage.removeItem('johann-test-token');status('Abgemeldet.')});
const b64=bytes=>btoa(String.fromCharCode(...bytes)),un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
$('save').onclick=()=>run(async()=>{const pass=$('pass').value;if(pass.length<14)throw Error('Mindestens 14 Zeichen verwenden.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key(pass,salt),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({note:$('note').value}))));await call('vault_put',{salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)});status('Verschlüsseltes Testarchiv gespeichert. Server erhält nur Geheimtext.')});
$('load').onclick=()=>run(async()=>{const {vault:v}=await call('vault_get');if(!v){status('Noch kein Archiv vorhanden.');return}const k=await key($('pass').value,un64(v.salt)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(v.iv)},k,un64(v.ciphertext));$('note').value=JSON.parse(new TextDecoder().decode(pt)).note;status('Archiv auf deinem Gerät entschlüsselt.')});
$('del').onclick=()=>run(async()=>{if(!confirm('Verschlüsseltes Archiv wirklich löschen?'))return;await call('vault_delete');$('note').value='';status('Archiv gelöscht.')});
$('deleteAccount').onclick=()=>run(async()=>{if(!confirm('Testkonto UND Archiv endgültig löschen?'))return;await call('auth_delete');token='';sessionStorage.removeItem('johann-test-token');status('Testkonto gelöscht.')});
</script></html>
